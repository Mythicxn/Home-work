<style>
:root{--bg:#e8ecf6;--card:#fff;--tx:#141941;--mu:#626892;--pr:#3d42c9;--prt:#3d42c9;--moon:#f4bf4f;--ok:#12805c;--okb:#dcf5ea;--no:#d23a45;--nob:#fde8ea;--bd:#d6dbec;--night:#10133a;--hf:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
--stars:radial-gradient(1.5px 1.5px at 8% 18%,#fff 60%,transparent 62%),radial-gradient(1px 1px at 22% 62%,#fffc 60%,transparent 62%),radial-gradient(1.5px 1.5px at 41% 28%,#fff 60%,transparent 62%),radial-gradient(1px 1px at 63% 14%,#fffc 60%,transparent 62%),radial-gradient(2px 2px at 78% 42%,#fff 60%,transparent 62%),radial-gradient(1px 1px at 91% 76%,#fffc 60%,transparent 62%),radial-gradient(1px 1px at 55% 82%,#fff9 60%,transparent 62%),radial-gradient(1px 1px at 30% 90%,#fff9 60%,transparent 62%)}
@media(prefers-color-scheme:dark){:root{--bg:#0c0f2e;--card:#171b45;--tx:#e9ebff;--mu:#9aa0d0;--pr:#6b70f2;--prt:#aeb1ff;--ok:#4cd9a0;--okb:#123a30;--no:#ff8088;--nob:#47202c;--bd:#2c3169;--night:#070920}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.6 "Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
body:has(#login:not([hidden])){background:var(--stars),linear-gradient(180deg,#0b0e32,#1a1f6e 62%,#2b2f93);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--hf);letter-spacing:-.01em}
h2,h3{margin:.2em 0 .5em}
h2{font-size:1.5rem;font-weight:700}

/* header */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;background:var(--stars),linear-gradient(100deg,#0e1137,#1f2478);color:#fff;border-bottom:2px solid rgba(244,191,79,.45)}
body:has(#login:not([hidden])) header{background:transparent;border-color:transparent}
header h1{margin:0;font:800 1.35rem/1 var(--hf);letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:#fbfdf2;object-fit:cover;box-shadow:0 0 0 2px var(--moon);flex:none}
.logo-lg{display:block;width:120px;height:120px;margin:-70px auto 14px;border-radius:50%;object-fit:cover;background:#fbfdf2;box-shadow:0 0 0 4px var(--moon),0 10px 34px rgba(244,191,79,.4)}
#who{font-size:.9rem;display:flex;gap:10px;align-items:center}

/* buttons */
button{background:var(--pr);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;transition:transform .12s,filter .15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button:active{transform:none}
button:disabled{opacity:.5;cursor:default;transform:none;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--moon) 75%,transparent);outline-offset:2px}
button.g{background:transparent;color:var(--prt);border:1.5px solid color-mix(in srgb,var(--prt) 55%,transparent)}
button.d{background:#c9323d;color:#fff}
header button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff}
.ai-btn{display:inline-flex;align-items:center;gap:8px}
input[type=text],select,textarea{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);transition:border-color .15s}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--moon)}
textarea{min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
details.card summary{cursor:pointer}

/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;margin-bottom:14px}
#main .card>b:first-child{font-family:var(--hf);color:var(--prt)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:.9rem}

/* login */
#login{max-width:440px;margin:90px auto 60px;padding:0 16px}
#login .card{border:0;border-radius:26px;padding:1px 28px 26px;box-shadow:0 26px 60px rgba(5,7,40,.5)}
#login h2{margin:.1em 0 .3em;text-align:center;font-size:1.4rem}
#login .mu{text-align:center}
#login input[type=password]{border-radius:12px!important;border-width:1.5px!important}
#login button{width:100%;margin-top:6px;padding:13px;background:var(--moon);color:#171a4a;font-size:1rem}
#err{color:var(--no);min-height:1.5em;margin:8px 0 0;text-align:center}

/* layout + sidebar */
#app{display:grid;grid-template-columns:240px 1fr;gap:20px;max-width:1120px;margin:20px auto;padding:0 16px;align-items:start}
aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;border-radius:22px}
aside .card{padding:10px;margin:0;background:linear-gradient(180deg,#171a52,#0f1239);border:1px solid rgba(255,255,255,.08);border-radius:22px;color:#e9ebff}
aside button.s{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;color:#dfe2ff;margin:2px 0;padding:10px 14px;border-radius:14px;font-weight:500}
aside button.s:hover{background:rgba(255,255,255,.08);transform:none;filter:none}
aside button.s.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--moon)}
aside small{color:inherit;opacity:1;background:rgba(255,255,255,.14);padding:0 8px;border-radius:999px;font-size:.75rem;line-height:1.6}
aside hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:8px 6px}
aside .mu{color:#a9aee0}

/* câu hỏi + phương án */
.op{display:block;padding:10px 14px;margin:6px 0;border-radius:12px;border:1.5px solid var(--bd);cursor:pointer;transition:border-color .12s,background .12s}
div.op{cursor:default}
.op:hover{border-color:var(--pr)}
.op:has(input:checked){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 9%,var(--card))}
.op input{accent-color:var(--pr);margin-right:8px}
.q.ok{border-left:6px solid var(--ok)}
.q.bad{border-left:6px solid var(--no)}
.op.right{background:linear-gradient(135deg,var(--okb),color-mix(in srgb,var(--okb) 72%,var(--card)));border:1.5px solid var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.op.wrong{background:linear-gradient(135deg,var(--nob),color-mix(in srgb,var(--nob) 72%,var(--card)));border:1.5px solid var(--no);box-shadow:inset 4px 0 0 var(--no)}

/* câu đúng/sai: hai nút cố định */
.st{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--bd)}
.st>span:first-child{min-width:0;overflow-wrap:anywhere}
.st .tf-options{display:grid;grid-template-columns:104px 104px;gap:12px;justify-content:end}
.st .tf-choice{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:104px;margin:0;padding:7px 13px;border:1.5px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);font-weight:600;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;white-space:nowrap}
.st .tf-choice:hover{transform:translateY(-1px);border-color:var(--pr)}
.st .tf-choice input{accent-color:var(--pr);margin:0;width:16px;height:16px}
.st .tf-choice:has(input:checked){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card));box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 12%,transparent)}
.st .tf-choice.yes:has(input:checked){border-color:var(--ok);background:var(--okb);color:var(--ok)}
.st .tf-choice.no:has(input:checked){border-color:var(--no);background:var(--nob);color:var(--no)}
@media(max-width:560px){.st{grid-template-columns:1fr;gap:8px}.st .tf-options{grid-template-columns:1fr 1fr;justify-content:stretch}.st .tf-choice{width:auto}}

/* kết quả, bảng, thống kê */
.tag-ok{color:var(--ok);font-weight:700}.tag-no{color:var(--no);font-weight:700}
.score{font:800 3.2rem/1 var(--hf);color:var(--prt);margin:.1em 0 .2em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font:600 .82rem var(--hf);color:var(--mu);background:color-mix(in srgb,var(--bd) 35%,transparent)}
tr:hover td{background:color-mix(in srgb,var(--pr) 5%,transparent)}
td:nth-child(3){white-space:normal}
.qi{display:block;max-width:100%;max-height:340px;margin:8px 0;border-radius:10px;border:1px solid var(--bd);background:#fff}
.op .qi{display:inline-block;vertical-align:middle;margin:4px 0 4px 8px;max-height:200px}
.pb{height:8px;min-width:80px;background:var(--bd);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--mu)}.dot.on{background:var(--ok)}.dot.aw{background:#e0a100}
.thumb{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--bd)}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#fff}
pre{background:var(--bg);padding:12px;border-radius:12px;overflow-x:auto;font-size:.85rem}
.ai{background:color-mix(in srgb,var(--pr) 7%,var(--card));border-left:4px solid var(--moon);border-radius:12px;padding:12px 16px;margin:10px 0;line-height:1.7}
.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}

/* thanh tiến độ mặt trăng khi làm bài */
.mphase{--p:0;position:relative;display:inline-block;width:30px;height:30px;border-radius:50%;background:#23286b;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.mphase::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--moon);transform:translateX(calc((var(--p) - 1) * 100%));transition:transform .4s}
.mphase.full{box-shadow:0 0 0 2px var(--moon),0 0 16px 2px rgba(244,191,79,.6)}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:var(--night);color:#fff;border-radius:999px;box-shadow:0 10px 30px rgba(8,10,40,.4);font:600 .95rem var(--hf);white-space:nowrap}
.dock button{background:var(--moon);color:#171a4a}
#main:has(.dock){padding-bottom:84px}

/* thông báo */
.warn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;max-width:min(92vw,520px);background:#c9323d;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 6px 24px #0005;font-weight:700;text-align:center;cursor:pointer;animation:wp .25s}
@keyframes wp{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:720px){#app{grid-template-columns:1fr}aside{position:static;max-height:none}header{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ===================== CẤU HÌNH ===================== */
const CONFIG = {
  ADMIN: "MythicxnDev",   // nhập tên này để mở trang quản trị
  ADMIN_EMAIL: "mythicxng@gmail.com",        // email tài khoản admin tạo trong Firebase Authentication (mật khẩu KHÔNG ghi ở đây)
  MIN_MATCH: 2,           // số chữ tối thiểu phải khớp với tên trong danh sách
  // Dán cấu hình Firebase vào đây để mọi người dùng chung dữ liệu. Để null = chỉ lưu trên máy này (chạy thử).
  firebase: {
    apiKey: "AIzaSyBI3DXvPxoL2JEcIFy9wbeuV1gB9T6OMFs",
    authDomain: "homework-lunar.firebaseapp.com",
    projectId: "homework-lunar",
    storageBucket: "homework-lunar.firebasestorage.app",
    messagingSenderId: "939241650118",
    appId: "1:939241650118:web:0dd50bf79610a5dea164c7"
  }
  /* ví dụ:
  firebase: { apiKey:"...", authDomain:"xxx.firebaseapp.com", projectId:"xxx", appId:"..." }
  */
};

const STUDENTS = ["Đào Công Lê Duy","Đỗ Nguyễn Hoàng Thơ","Huỳnh Hải My","Lê Ngọc Thiên Hồng","Lê Nguyễn Bảo Khang","Lê Nguyễn Hải Vân","Lê Phúc Tấn","Ngô Nguyễn Bảo An","Nguyễn Bảo Vy","Nguyễn Gia Bảo","Nguyễn Hoài Thảo","Nguyễn Ngọc Quỳnh Như","Nguyễn Ngọc Thảo Phương","Nguyễn Ngọc Tuyết","Nguyễn Nhật Nam","Nguyễn Phan Cát Tường","Nguyễn Thành Luân","Nguyễn Thanh Trúc","Nguyễn Thị Anh","Nguyễn Tuấn Dũng","Nguyễn Tuấn Khôi","Phạm Hà Ngọc Bích","Phạm Ngọc Quế Minh","Phạm Nguyễn Hồng Lan","Phạm Nguyễn Thiên Phúc","Phạm Trần Tâm Nguyên","Trần Bảo Ngọc","Trần Cao Tiến","Trần Minh Khôi","Trần Ngọc Khánh An","Trần Ngọc Quỳnh Trâm","Trần Thanh Sang","Trịnh Hoàng Phát","Trịnh Hoàng Phong","Võ Lâm Kim Thương"];
const DEFAULT_SUBJECTS = ["Toán","Ngữ văn","Tiếng Anh","Vật lí","Hóa học","Sinh học","Lịch sử","Địa lí","Tin học"];

/* ===================== TIỆN ÍCH ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/\s+/g, " ").trim();

function findStudent(input) {
  const words = [...new Set(norm(input).split(" ").filter(Boolean))];
  if (!words.length) return null;
  const need = Math.min(CONFIG.MIN_MATCH, words.length);
  let best = null, bestN = 0;
  STUDENTS.forEach(st => {
    const sw = new Set(norm(st).split(" "));
    const n = words.filter(w => sw.has(w)).length;
    if (n >= need && n > bestN) { best = st; bestN = n; }
  });
  return best;
}

/* ===================== LƯU TRỮ ===================== */
let store, cloud = false;
(function initStore() {
  if (CONFIG.firebase && typeof firebase !== "undefined") {
    firebase.initializeApp(CONFIG.firebase);
    const fs = firebase.firestore();
    cloud = true;
    store = {
      sub: (c, cb, er) => fs.collection(c).onSnapshot(s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), er || (e => console.error(c, e))),

/* ===================== ĐỌC ĐỀ TỪ VĂN BẢN ===================== */
const HELP = `Câu 1: Thủ đô của Việt Nam là gì?
A. Huế
B. Hà Nội
C. Đà Nẵng
D. Cần Thơ
Đáp án: B

Câu 2: Xét các phát biểu sau về nước:
a) Nước sôi ở 100°C ở áp suất thường = Đ
b) Nước đá nặng hơn nước lỏng = S
c) Nước là hợp chất = Đ
d) Nước không có thể tích = S`;

function parse(text) {
  const qs = [], errors = [];
  let cur = null, m;
  String(text).split(/\r?\n/).forEach(raw => {
    const l = raw.trim();
    if (!l) return;
    if ((m = l.match(/^C[âa]u\s*\d*\s*[:.)]\s*(.*)$/i))) { cur = { q: m[1], opts: [], sts: [], ans: null }; qs.push(cur); }
    else if (!cur) return;
    // ý đúng/sai: a) b) c) d), A. B. C. D. hoặc I. II. III. IV. kết thúc bằng "= Đ" / "= S" (đặt TRƯỚC nhánh phương án A-D)
    else if ((m = l.match(/^([a-d])[.)]\s*(.*?)\s*(?:=|\|)\s*(Đ|đ|S|s)$/)) || (m = l.match(/^([A-D]|IV|III|II|I)[.)]\s*(.*?)\s*(?:=|\|)\s*(Đ|đ|S)$/))) cur.sts.push({ k: m[1], t: m[2], v: m[3].toUpperCase() === "Đ" });
    else if ((m = l.match(/^([A-D])[.)]\s*(.*)$/))) cur.opts.push({ k: m[1], t: m[2] });
    else if ((m = l.match(/^(?:Đáp án|Dap an|ĐA|DA)\s*[:.]\s*([A-Da-d])/i))) cur.ans = m[1].toUpperCase();
    else cur.q += " " + l;
  });
  // chuẩn hóa
  qs.forEach(q => {
    // câu A-D có "Đáp án: X" nhưng mỗi dòng dính "= Đ/S": coi là 4 phương án trắc nghiệm
    if (q.ans && q.sts.length && !q.opts.length && q.sts.every(s => /^[A-D]$/.test(s.k)) && q.sts.some(s => s.k === q.ans)) {
      q.opts = q.sts.map(s => ({ k: s.k, t: s.t })); q.sts = [];
    }
    // câu đúng/sai: đổi nhãn (I, II, A, B...) về a, b, c, d để hiển thị và chấm điểm
    q.sts.forEach((s, i) => { s.k = String.fromCharCode(97 + i); });
  });
  const ok = [];
  qs.forEach((q, i) => {
    if (q.sts.length >= 2) ok.push(q);
    else if (q.opts.length >= 2 && q.ans && q.opts.some(o => o.k === q.ans)) ok.push(q);
    else errors.push("Câu " + (i + 1) + " thiếu lựa chọn hoặc đáp án");
  });
  return { qs: ok, errors };
}

function grade(qs, A) {
  let sc = 0, right = 0;
  qs.forEach((q, i) => {
    if (q.sts.length) {
      const c = q.sts.filter(s => A[i + s.k] === s.v).length, n = q.sts.length;
      sc += n === 4 ? [0, .1, .25, .5, 1][c] : c / n;
      if (c === n) right++;
    } else if (A[i] === q.ans) { sc++; right++; }
  });
  return { score: Math.round(sc / qs.length * 100) / 10, right };
}

const IMG_RE = /\[(?:ảnh|anh|img)\s*:\s*([^\]]+?)\s*\]/gi;
const ikey = id => String(id).trim().replace(/[^\w-]/g, "_");
const isUrl = v => /^https?:\/\//i.test(v);
const MATH_RE = /\$\$([\s\S]+?)\$\$|\$(?!\s)([^$\n]*?[^\s$])\$/g;
function mathHtml(src, disp) {
  try { if (window.katex) return katex.renderToString(src, { throwOnError: false, displayMode: disp, output: "html" }); } catch (e) {}
  return esc(disp ? "$$" + src + "$$" : "$" + src + "$");
}
function rt(text, imgs) {
  let out = "", last = 0, m; text = String(text); MATH_RE.lastIndex = 0;
  while ((m = MATH_RE.exec(text))) { out += rtp(text.slice(last, m.index), imgs); out += mathHtml(m[1] !== undefined ? m[1] : m[2], m[1] !== undefined); last = m.index + m[0].length; }
  return out + rtp(text.slice(last), imgs);
}
function rtp(text, imgs) {
  return esc(text).replace(/-&gt;/g, "→").replace(/&lt;=&gt;/g, "⇌").replace(IMG_RE, (_, id) => {
    id = id.trim();
    const src = isUrl(id.replace(/&amp;/g, "&")) ? id : (imgs || {})[ikey(id)];
    return src ? `<img class="qi" src="${src}" alt="Hình minh họa" loading="lazy">` : `<span class="tag-no">[thiếu ảnh ${id}]</span>`;
  });
}

function tokensOf(text) { const out = []; String(text).replace(IMG_RE, (_, id) => { id = id.trim(); if (!isUrl(id) && !out.includes(id)) out.push(id); }); return out; }
function compress(file, max = 800, quality = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", quality));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Không đọc được ảnh")); };
    im.src = url;
  });
}

function cropData(src, b) {
  return new Promise((res, rej) => {

      y0 = Math.max(0, y0 - pad); x0 = Math.max(0, x0 - pad); y1 = Math.min(1000, y1 + pad); x1 = Math.min(1000, x1 + pad);
      const sx = x0 / 1000 * im.width, sy = y0 / 1000 * im.height, sw = (x1 - x0) / 1000 * im.width, sh = (y1 - y0) / 1000 * im.height;
      if (sw < 8 || sh < 8) return rej(new Error("box"));
      const k = Math.min(1, 800 / Math.max(sw, sh)), c = document.createElement("canvas");
      c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.72));
    };
    im.onerror = () => rej(new Error("img")); im.src = src;
  });
}

      `Hãy kiểm tra lại nội dung và đáp án trước khi lưu.` + (total > AI_SCAN_MAX ? ` Chỉ xử lý ${AI_SCAN_MAX} ảnh đầu, hãy chạy lại cho các ảnh còn lại.` : "") + (note ? `<br>Ghi chú của AI: ${esc(note)}` : "");
  } catch (e) { st.innerHTML = `<span class="tag-no">Lỗi: ${esc(e.message || e)}</span>`; }

/* ===================== BÀI LÀM DỞ + RỜI TAB ===================== */
const WARN_FROM = 3; // từ lần rời tab thứ mấy thì hiện thông báo
const SW = { away: false, tm: null };
const dKey = () => "lh_draft_" + norm(S.user).replace(/\s+/g, "_") + "_" + S.quiz.id;
const qSig = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ":" + h; };
function readAnswers() {
  const A = {}; let miss = 0;
  S.qs.forEach((q, i) => {
    if (q.sts.length) q.sts.forEach(s => { const r = document.querySelector(`input[name="q${i}${s.k}"]:checked`); if (r) A[i + s.k] = r.value === "1"; else miss++; });
    else { const r = document.querySelector(`input[name="q${i}"]:checked`); if (r) A[i] = r.value; else miss++; }
  });
  return { A, miss };
}
function applyAnswers() {
  S.qs.forEach((q, i) => {
    if (q.sts.length) q.sts.forEach(s => { const a = S.A[i + s.k]; if (a !== undefined) { const r = document.querySelector(`input[name="q${i}${s.k}"][value="${a ? 1 : 0}"]`); if (r) r.checked = true; } });
    else if (S.A[i] !== undefined) { const r = document.querySelector(`input[name="q${i}"][value="${S.A[i]}"]`); if (r) r.checked = true; }
  });
}
function saveDraft() {
  if (!S.quiz || S.view !== "take") return;
  try { localStorage.setItem(dKey(), JSON.stringify({ sig: qSig(S.quiz.text), qs: S.qs, A: S.A, sw: S.sw || 0, t: Date.now() })); } catch (e) {}
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(dKey()) || "null");
    if (d && d.sig === qSig(S.quiz.text) && Date.now() - d.t < 12 * 3600 * 1000 && Array.isArray(d.qs) && d.qs.length && d.A && Object.keys(d.A).length) return d;
  } catch (e) {}
  return null;
}
function clearDraft() { try { localStorage.removeItem(dKey()); } catch (e) {} }
function updateProg() {
  const mph = $("mph"), pc = $("pc"); if (!mph || !pc) return;
  const done = S.qs.filter((q, i) => q.sts.length ? q.sts.every(s => S.A[i + s.k] !== undefined) : S.A[i] !== undefined).length, n = S.qs.length;
  pc.textContent = done + "/" + n + " câu";
  mph.style.setProperty("--p", n ? done / n : 0); mph.classList.toggle("full", n > 0 && done === n);
}
function onAnswer() { S.A = readAnswers().A; saveDraft(); updateProg(); }

function warnToast(n) {
  const msg = n >= 6 ? `Pls pls, gg đại đi, ôn mà còn cheat (${n} lần)` : n >= 4 ? `Stop cheating bruh (${n} lần)` : `Á à à, cheat vừa thôi :) (${n} lần)`;
  let w = $("warn"); if (w) w.remove();
  w = document.createElement("div"); w.id = "warn"; w.className = "warn"; w.setAttribute("role", "alert"); w.textContent = msg;
  w.onclick = () => w.remove(); document.body.appendChild(w);
  setTimeout(() => { if (w.parentNode) w.remove(); }, 6000);
}
function swLeave() {
  if (S.view !== "take" || SW.away) return;
  SW.away = true; S.sw = (S.sw || 0) + 1; saveDraft(); liveSend({ sw: S.sw });
}
function swBack() {
  if (!SW.away) return;
  SW.away = false;
  if (S.view === "take" && S.sw >= WARN_FROM) warnToast(S.sw);
}
document.addEventListener("visibilitychange", () => document.hidden ? swLeave() : swBack());
window.addEventListener("blur", () => { clearTimeout(SW.tm); SW.tm = setTimeout(() => { if (!document.hasFocus()) swLeave(); }, 600); });
window.addEventListener("focus", () => { clearTimeout(SW.tm); swBack(); });

function exportCsv() {
  const rows = [["Họ tên", "Bài", "Điểm", "Thời gian", "Số lần rời tab"]].concat(S.results.slice().reverse().map(r => [r.name, r.quiz, r.score, new Date(r.time).toLocaleString("vi-VN"), r.sw || 0]));
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "ket-qua-lunar-homework.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function renderStats() {
  const RS = S.results, avg = a => a.reduce((x, y) => x + y, 0) / a.length, f1 = n => String(Math.round(n * 10) / 10).replace(".", ",");
  const subj = id => (S.subjects.find(s => s.id === id) || {}).name || "";
  if (!S.quizzes.length) return `<h2>Thống kê</h2><div class="card mu">Chưa có bài nào.</div>`;
  if (!S.statQuiz || !S.quizzes.some(q => q.id === S.statQuiz)) S.statQuiz = S.quizzes[0].id;
  const rowsQ = S.quizzes.map(q => {
    const rs = RS.filter(r => r.quizId === q.id), sc = rs.map(r => r.score), who = new Set(rs.map(r => r.name));
    return `<tr><td>${esc(q.title)} <small class="mu">· ${esc(subj(q.subject))}</small></td><td>${rs.length}</td><td>${who.size}/${STUDENTS.length}</td><td>${rs.length ? f1(avg(sc)) : "–"}</td><td>${rs.length ? Math.max(...sc) : "–"}</td><td>${rs.length ? Math.min(...sc) : "–"}</td></tr>`;
  }).join("");
  const q = S.quizzes.find(x => x.id === S.statQuiz), rs = RS.filter(r => r.quizId === q.id), withD = rs.filter(r => Array.isArray(r.wr) && r.n);
  const pq = parse(q.text).qs, cnt = pq.map(() => 0);
  withD.forEach(r => r.wr.forEach(i => { if (cnt[i] !== undefined) cnt[i]++; }));
  const list = pq.map((p, i) => ({ i, c: cnt[i], t: plain(p.q).replace(/\s+/g, " ").slice(0, 110) })).sort((a, b) => b.c - a.c || a.i - b.i);
  const did = new Set(rs.map(r => r.name)), not = STUDENTS.filter(n => !did.has(n));
  const qrows = withD.length ? list.map(x => { const pct = Math.round(x.c / withD.length * 100); return `<tr><td><b>Câu ${x.i + 1}</b></td><td>${esc(x.t)}</td><td><div class="pb"><i style="width:${pct}%;background:var(--no)"></i></div></td><td>${x.c}/${withD.length} (${pct}%)</td></tr>`; }).join("") : "";
  return `<div class="row sp"><h2>Thống kê</h2><button class="g" onclick="exportCsv()">Xuất Excel (CSV)</button></div>
    <div class="card"><b>Tổng quan</b><div class="mu">${RS.length} lượt làm · ${new Set(RS.map(r => r.name)).size}/${STUDENTS.length} học sinh đã làm${RS.length ? " · điểm trung bình " + f1(avg(RS.map(r => r.score))) : ""}</div>
      <div class="tw"><table><tr><th>Bài</th><th>Lượt làm</th><th>Học sinh</th><th>Điểm TB</th><th>Cao nhất</th><th>Thấp nhất</th></tr>${rowsQ}</table></div></div>
    <div class="card"><p><label>Xem chi tiết bài<select onchange="S.statQuiz=this.value;renderMain()">${S.quizzes.map(x => `<option value="${x.id}" ${x.id === q.id ? "selected" : ""}>${esc(x.title)} (${esc(subj(x.subject))})</option>`).join("")}</select></label></p>
      <b>Câu sai nhiều nhất</b> <span class="mu">(tính theo lượt làm; số câu theo thứ tự gốc trong đề)</span>
      ${withD.length ? `<div class="tw"><table><tr><th>Câu</th><th>Nội dung</th><th></th><th>Sai</th></tr>${qrows}</table></div>` : `<p class="mu">Chưa có dữ liệu. Thống kê câu sai chỉ tính các lượt làm sau khi cập nhật bản này.</p>`}
      <p><b>Chưa làm bài này (${not.length}):</b> <span class="mu">${not.length ? not.map(esc).join(", ") : "Cả lớp đã làm"}</span></p></div>`;
}

function newImgId() { let n = 1; const used = new Set([...Object.keys(S.quiz.imgs), ...tokensOf($("ex").value).map(ikey)]); while (used.has("h" + n)) n++; return "h" + n; }

function reviewQ(q, i) {
  const A = S.A; let ok, body;
  if (q.sts.length) {
    ok = q.sts.every(s => A[i + s.k] === s.v);
    body = q.sts.map(s => {
      const a = A[i + s.k], good = a === s.v, lab = x => x === undefined ? "bỏ trống" : x ? "Đúng" : "Sai";
      return `<div class="st"><span>${s.k}) ${R(s.t)}</span><span class="${good ? "tag-ok" : "tag-no"}">${good ? "✓" : "✗"} Bạn chọn: ${lab(a)}${good ? "" : " · Đáp án: " + lab(s.v)}</span></div>`;
    }).join("");
  } else {
    ok = A[i] === q.ans;
    body = q.opts.map(o => {
      const c = o.k === q.ans ? "right" : (o.k === A[i] ? "wrong" : "");
      return `<div class="op ${c}">${o.k}. ${R(o.t)} ${o.k === q.ans ? `<span class="tag-ok">✓ đáp án đúng</span>` : o.k === A[i] ? `<span class="tag-no">✗ bạn chọn</span>` : ""}</div>`;
    }).join("") + (A[i] === undefined ? `<div class="tag-no">Bạn chưa trả lời câu này.</div>` : "");
  }
  if (S.onlyWrong && ok) return "";
  return `<div class="card q ${ok ? "ok" : "bad"}"><b>Câu ${i + 1}.</b> ${R(q.q)} <span class="${ok ? "tag-ok" : "tag-no"}">${ok ? "Đúng" : "Sai"}</span>${body}${!ok && aiReady() ? aiBtnQ(i) : ""}</div>`;
}

  const rows = S.results.slice(0, 200);
  $("board").innerHTML = `<h3>Bảng kết quả</h3>` + (rows.length ? `<div class="tw"><table><tr><th>#</th><th>Người làm</th><th>Bài</th><th>Điểm</th><th>Lúc</th>${S.admin ? "<th>Rời tab</th><th></th>" : ""}</tr>` +
    rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.quiz)}</td><td><b>${r.score}</b>/10</td><td>${new Date(r.time).toLocaleString("vi-VN")}</td>${S.admin ? `<td>${r.sw ? `<span class="tag-no">${r.sw}</span>` : "0"}</td><td><button class="d" onclick="delRes('${r.id}')">Xóa</button></td>` : ""}</tr>`).join("") + `</table></div>` : `<p class="mu">Chưa có ai làm bài.</p>`);
}

/* ===================== LÀM BÀI ===================== */
function shuf(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Đáp án kiểu "Cả A và B", "Tất cả đều đúng"... phụ thuộc vị trí nên không xáo phương án của câu đó.
const KEEP_RE = /tất cả|cả\s+[a-d]\b|\b[a-d]\s*(và|,)\s*[a-d]\b|đều\s+(đúng|sai)|không\s+có\s+đáp\s+án|không\s+đáp\s+án/i;
function shuffleQuiz(qs) {
  return shuf(qs).map(q => {
    if (q.sts.length) return { ...q, sts: shuf(q.sts).map((s, i) => ({ ...s, k: String.fromCharCode(97 + i) })) };
    if (q.opts.some(o => KEEP_RE.test(o.t))) return q;
    const correct = q.opts.find(o => o.k === q.ans), sh = shuf(q.opts);
    return { ...q, opts: sh.map((o, i) => ({ ...o, k: String.fromCharCode(65 + i) })), ans: String.fromCharCode(65 + sh.indexOf(correct)) };
  });
}
function take(id) {
  S.quiz = S.quizzes.find(q => q.id === id);
  if (!S.quiz) return go("list");
  const d = loadDraft();
  if (d && confirm(`Bạn có bài đang làm dở (đã trả lời ${Object.keys(d.A).length} ý/câu). Bấm OK để làm tiếp, Hủy để làm bài mới.`)) { S.qs = d.qs; S.A = d.A; S.sw = d.sw || 0; }
  else { clearDraft(); S.qs = shuffleQuiz(parse(S.quiz.text).qs.map((q, i) => ({ ...q, oi: i }))); S.A = {}; S.sw = 0; }
  SW.away = false; S.onlyWrong = false; S.aiCache = {}; S.aiBusy = {};
  S.view = "take"; renderSide(); renderMain(); window.scrollTo(0, 0);
  const sb = S.subjects.find(x => x.id === S.quiz.subject);
  liveSend({ state: "doing", quiz: S.quiz.title, subject: sb ? sb.name : null, since: Date.now(), sw: S.sw || 0 });
}
function submitQuiz() {
  const { A, miss } = readAnswers();
  if (miss && !confirm(`Còn ${miss} ý/câu chưa trả lời. Vẫn nộp bài?`)) return;
  S.A = A;
  const { score } = grade(S.qs, A);
  const wr = S.qs.map((q, i) => qOk(q, i) ? null : q.oi).filter(x => x != null);
  if (!S.admin) store.put("results", { id: uid(), name: S.user, quiz: S.quiz.title, quizId: S.quiz.id, score, time: Date.now(), sw: S.sw || 0, n: S.qs.length, wr });
  clearDraft();
  liveSend(LIVE_IDLE);
  S.view = "review"; renderMain(); window.scrollTo(0, 0);
}

/* ===================== QUẢN TRỊ ===================== */
function addSub() { const n = prompt("Tên môn học mới:"); if (n && n.trim()) store.put("subjects", { id: uid(), name: n.trim(), o: Date.now() }); }
function renameSub() { const s = S.subjects.find(x => x.id === S.sub); const n = prompt("Tên mới:", s.name); if (n && n.trim()) store.put("subjects", { ...s, name: n.trim() }); }
function delSub() {
  const s = S.subjects.find(x => x.id === S.sub);
  if (!confirm(`Xóa môn “${s.name}” và tất cả bài trong môn này?`)) return;
  S.quizzes.filter(q => q.subject === s.id).forEach(q => store.del("quizzes", q.id));
  store.del("subjects", s.id); S.sub = null; go("home");
}
function editQuiz(id) {
  S.quiz = id ? { ...S.quizzes.find(q => q.id === id) } : { id: "", subject: S.sub, title: "", text: "" };
  S.quiz.imgs = { ...(S.quiz.imgs || {}) };
  S.view = "edit"; renderMain(); window.scrollTo(0, 0);
}
function prevQ() {
  const r = parse($("ex").value), toks = tokensOf($("ex").value);
  $("eimgs").innerHTML = toks.length ? `<div class="card"><b>Ảnh trong đề</b>` + toks.map(id => {
    const src = S.quiz.imgs[ikey(id)];
    return `<div class="thumb">${src ? `<img src="${src}" alt="">` : ""}<div style="flex:1"><code>[ảnh:${esc(id)}]</code><div class="${src ? "mu" : "tag-no"}">${src ? Math.round(src.length / 1024) + " KB" : "Chưa có ảnh"}</div></div><button class="g" data-k="${esc(id)}" onclick="pickImg(this.dataset.k)">${src ? "Đổi ảnh" : "Chọn ảnh"}</button></div>`;
  }).join("") + `<div class="mu">Tổng dung lượng ảnh: ${Math.round(imgBytes($("ex").value) / 1024)} KB / ${Math.round(IMG_LIMIT / 1024)} KB</div></div>` : "";
  $("ep").innerHTML = `Đọc được <b>${r.qs.length}</b> câu hợp lệ.` + (r.errors.length ? ` <span class="tag-no">${esc(r.errors.join("; "))}</span>` : "");
  prevPreview(r.qs);
}
function prevPreview(qs) {
  const d = $("epvd"); if (!d || !d.open) return;
  $("epv").innerHTML = qs.slice(0, 3).map((q, i) => `<div style="margin:8px 0"><b>Câu ${i + 1}.</b> ${R(q.q)}` +
    (q.sts.length ? q.sts.map(x => `<div>${x.k}) ${R(x.t)} <small class="mu">= ${x.v ? "Đ" : "S"}</small></div>`).join("") : q.opts.map(o => `<div>${o.k}. ${R(o.t)}${o.k === q.ans ? ` <span class="tag-ok">✓</span>` : ""}</div>`).join("")) + `</div>`).join("") || `<span class="mu">Chưa có câu nào.</span>`;
}
function saveQuiz() {
  const title = $("et").value.trim(), text = $("ex").value, r = parse(text);
  if (!title) return alert("Hãy nhập tên bài.");
  if (!r.qs.length) return alert("Chưa có câu hỏi hợp lệ nào. Xem “Cách viết đề” bên dưới.");
  if (r.errors.length && !confirm("Có câu bị lỗi và sẽ bị bỏ qua:\n" + r.errors.join("\n") + "\nVẫn lưu?")) return;
  const miss = tokensOf(text).filter(id => !S.quiz.imgs[ikey(id)]);
  if (miss.length && !confirm("Còn ảnh chưa chọn: " + miss.join(", ") + "\nVẫn lưu?")) return;
  if (imgBytes(text) > IMG_LIMIT) return alert("Tổng dung lượng ảnh quá lớn (tối đa khoảng 900 KB mỗi bài). Hãy bớt ảnh hoặc dùng link ảnh [ảnh:https://...].");
  const imgs = {}; tokensOf(text).forEach(id => { const k = ikey(id); if (S.quiz.imgs[k]) imgs[k] = S.quiz.imgs[k]; });
  S.sub = $("es").value;
  store.put("quizzes", { id: S.quiz.id || uid(), subject: S.sub, title, text, imgs, time: S.quiz.time || Date.now() })
    .then(() => go("list")).catch(e => alert("Lưu thất bại: " + e.message));
}
function delQuiz(id) { if (confirm("Xóa bài này?")) store.del("quizzes", id); }
function delRes(id) { if (confirm("Xóa dòng kết quả này?")) store.del("results", id); }
</script>
