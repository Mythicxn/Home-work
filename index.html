<style>
:root{--bg:#eceef6;--card:#fff;--tx:#1b2040;--mu:#666c8f;--pr:#3f43a8;--moon:#f0c45a;--ok:#17874b;--okb:#dff3e7;--no:#c93030;--nob:#fce6e6;--bd:#d9dcec}
@media(prefers-color-scheme:dark){:root{--bg:#12142a;--card:#1c1f3d;--tx:#e8e9fb;--mu:#9a9ec6;--pr:#8e92ff;--ok:#4cd387;--okb:#15382a;--no:#ff7b7b;--nob:#44202a;--bd:#30335a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 "Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;background:#1b1f4b;color:#fff}
header h1{margin:0;font-size:1.35rem;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;background:#fbfdf2;object-fit:cover;box-shadow:0 0 0 2px #fff6;flex:none}
.logo-lg{display:block;width:130px;height:130px;margin:0 auto 12px;border-radius:50%;object-fit:cover;box-shadow:0 2px 10px #0003}
#who{font-size:.9rem;display:flex;gap:10px;align-items:center}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;transition:all .15s ease}
button:hover{opacity:.92;transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.d{background:var(--no);color:#fff}
header button{background:transparent;border:1px solid #fff8;color:#fff}
input[type=text],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea{min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.02)}
#login{max-width:430px;margin:70px auto;padding:0 16px}
#login h2{margin-top:0}
#err{color:var(--no);min-height:1.5em;margin:8px 0 0}
#app{display:grid;grid-template-columns:230px 1fr;gap:18px;max-width:1100px;margin:18px auto;padding:0 16px;align-items:start}
aside .card{padding:8px}
aside button.s{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;color:var(--tx);margin:2px 0;padding:9px 12px}
aside button.s.on{background:var(--pr);color:#fff;font-weight:600}
aside small{color:inherit;opacity:.7}
aside hr{border:0;border-top:1px solid var(--bd);margin:6px 0}
h2,h3{margin:.2em 0 .5em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:.9rem}
.op{display:block;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);margin:6px 0;cursor:pointer;background:var(--card);transition:all .15s ease}
.op:hover{background:var(--bg);border-color:var(--pr)}
.st{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--bd)}

/* GIAO DIỆN NÚT ĐÚNG / SAI MỚI (MODERN SEGMENTED BUTTONS) */
.tf-group{display:inline-flex;background:var(--bg);padding:3px;border-radius:10px;border:1px solid var(--bd);gap:2px}
.tf-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 16px;border-radius:7px;font-size:.88rem;font-weight:600;cursor:pointer;user-select:none;transition:all .15s ease;color:var(--mu)}
.tf-btn input{position:absolute;opacity:0;pointer-events:none}
.tf-btn:hover{color:var(--tx);background:rgba(0,0,0,.03)}
.tf-btn.is-true input:checked + span, .tf-btn.is-true:has(input:checked){background:var(--ok);color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.tf-btn.is-false input:checked + span, .tf-btn.is-false:has(input:checked){background:var(--no);color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.1)}

.q.ok{border-left:6px solid var(--ok)}
.q.bad{border-left:6px solid var(--no)}
.op.right{background:var(--okb);border-color:var(--ok);font-weight:600}
.op.wrong{background:var(--nob);border-color:var(--no)}
.tag-ok{color:var(--ok);font-weight:700}.tag-no{color:var(--no);font-weight:700}
.score{font-size:2rem;font-weight:700}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td:nth-child(3){white-space:normal}
.qi{display:block;max-width:100%;max-height:340px;margin:8px 0;border-radius:8px;border:1px solid var(--bd);background:#fff}
.op .qi{display:inline-block;vertical-align:middle;margin:4px 0 4px 8px;max-height:200px}
pre{background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto;font-size:.85rem}
.ai{background:var(--bg);border-left:4px solid var(--pr);border-radius:8px;padding:10px 14px;margin:10px 0;line-height:1.7}
@media(max-width:720px){#app{grid-template-columns:1fr}.st{flex-direction:column;align-items:flex-start}}
</style>

</head>

/* ===================== TIỆN ÍCH ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/\s+/g, " ").trim();

function findStudent(input) {
  const words = [...new Set(norm(input).split(" ").filter(Boolean))];
  if (!words.length) return null;
  const need = Math.min(CONFIG.MIN_MATCH, words.length);
  let best = null, bestN = 0;
  STUDENTS.forEach(st => {
    const sw = new Set(norm(st).split(" "));
    const n = words.filter(w => sw.has(w)).length;
    if (n >= need && n > bestN) { best = st; bestN = n; }
  });
  return best;
}

/* ===================== ĐỌC ĐỀ TỪ VĂN BẢN ===================== */
function parse(text) {
  const qs = [], errors = [];
  let cur = null, m;
  String(text).split(/\r?\n/).forEach(raw => {
    const l = raw.trim();
    if (!l) return;
    if ((m = l.match(/^C[âa]u\s*\d*\s*[:.)]\s*(.*)$/i))) { cur = { q: m[1], opts: [], sts: [], ans: null }; qs.push(cur); }
    else if (!cur) return;
    else if ((m = l.match(/^([A-D])[.)]\s*(.*)$/))) cur.opts.push({ k: m[1], t: m[2] });
    else if ((m = l.match(/^([a-d])[.)]\s*(.*?)\s*(?:=|\|)\s*(Đ|đ|S|s)$/))) cur.sts.push({ k: m[1], t: m[2], v: m[3].toUpperCase() === "Đ" });
    else if ((m = l.match(/^(?:Đáp án|Dap an|ĐA|DA)\s*[:.]\s*([A-Da-d])/i))) cur.ans = m[1].toUpperCase();
    else cur.q += " " + l;
  });
  const ok = [];
  qs.forEach((q, i) => {
    if (q.sts.length >= 2) ok.push(q);
    else if (q.opts.length >= 2 && q.ans && q.opts.some(o => o.k === q.ans)) ok.push(q);
    else errors.push("Câu " + (i + 1) + " thiếu lựa chọn hoặc đáp án");
  });
  return { qs: ok, errors };
}

function grade(qs, A) {
  let sc = 0, right = 0;
  qs.forEach((q, i) => {
    if (q.sts.length) {
      const c = q.sts.filter(s => A[i + s.k] === s.v).length, n = q.sts.length;
      sc += n === 4 ? [0, .1, .25, .5, 1][c] : c / n;
      if (c === n) right++;
    } else if (A[i] === q.ans) { sc++; right++; }
  });
  return { score: Math.round(sc / qs.length * 100) / 10, right };
}

const AI_DEF = { 
  gemini: { name: "Google Gemini", model: "gemini-3.1-flash-lite" },

const AI_SYS = "Bạn là giáo viên hỗ trợ học sinh lớp 11 ở Việt Nam. Trả lời bằng tiếng Việt, ngắn gọn, dễ hiểu, thân thiện. Coi 'Đáp án đề' là đáp án chính thức. Dùng **in đậm** cho ý chính.";

const aiMd = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>").replace(/^\s*[-*]\s+/gm, "• ").replace(/\n/g, "<br>");

const qOk = (q, i) => q.sts.length ? q.sts.every(s => S.A[i + s.k] === s.v) : S.A[i] === q.ans;

function aiQText(q, i) {
  const A = S.A; let t = `Câu ${i + 1}: ${plain(q.q)}\n`;
  if (q.sts.length) q.sts.forEach(s => { const a = A[i + s.k]; t += `${s.k}) ${plain(s.t)} | Đáp án đề: ${s.v ? "Đúng" : "Sai"} | HS chọn: ${a === undefined ? "bỏ trống" : a ? "Đúng" : "Sai"}\n`; });
  else { q.opts.forEach(o => t += `${o.k}. ${plain(o.t)}\n`); t += `Đáp án đề: ${q.ans} | HS chọn: ${A[i] || "bỏ trống"}\n`; }
  return t;
}

async function aiCall(system, user, o) {
  if (!o) { 
    const sec = await store.get("secrets", "ai"); 
    o = { provider: S.ai.provider, model: S.ai.model, key: sec && sec.key }; 
  }
  if (!o.key) throw new Error("Chưa có key API.");

  const provider = o.provider || "gemini";
  const primaryModel = o.model || AI_DEF[provider].model;
  
  const fallbackList = provider === "gemini" 
    ? [primaryModel, "gemini-3.1-flash-lite", "gemini-3.5-flash-lite", "gemini-2.5-flash-lite", "gemini-3.6-flash"]
    : [primaryModel];

  const modelsToTry = [...new Set(fallbackList)];
  let lastError = null;

  for (const model of modelsToTry) {
    try {
      const J = { "Content-Type": "application/json" };
      let r, d;

      if (provider === "openai") {
        r = await fetch("https://api.openai.com/v1/chat/completions", { 
          method: "POST", 
          headers: { ...J, Authorization: "Bearer " + o.key }, 
          body: JSON.stringify({ model, messages: [{ role: "system", content: system }, { role: "user", content: user }] }) 
        });
        d = await r.json(); 
        if (!r.ok) throw new Error((d.error && d.error.message) || r.status);
        return d.choices[0].message.content;
      }

      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { 
        method: "POST", 
        headers: { ...J, "x-goog-api-key": o.key }, 
        body: JSON.stringify({ 
          systemInstruction: { parts: [{ text: system }] }, 
          contents: [{ role: "user", parts: [{ text: user }] }], 
          generationConfig: { temperature: .4 } 
        }) 
      });
      
      d = await r.json(); 
      if (!r.ok) {
        const errObj = d.error || {};
        throw new Error(errObj.message || `HTTP ${r.status}`);
      }

      const c = (d.candidates || [])[0] && d.candidates[0].content;
      if (!c || !c.parts) throw new Error("AI không trả về nội dung.");
      
      return c.parts.map(x => x.text || "").join("");

    } catch (err) {
      lastError = err;
      const errMsg = String(err.message || err).toLowerCase();
      if (errMsg.includes("quota") || errMsg.includes("429") || errMsg.includes("demand") || errMsg.includes("limit")) {
        continue;
      }
      throw err;
    }
  }

  throw lastError || new Error("Các model AI hiện đang bận, vui lòng thử lại sau.");
}

  catch (e) { if (S.quiz === quiz) S.aiCache[key] = { e: e.message || String(e) }; }
  delete S.aiBusy[key]; if (S.view === "review") renderMain();
}

              <label class="tf-btn is-true">
                <input type="radio" name="q${i}${s.k}" value="1">
                <span>Đúng</span>
              </label>
              <label class="tf-btn is-false">
                <input type="radio" name="q${i}${s.k}" value="0">
                <span>Sai</span>
              </label>
            </div>
          </div>`
        ).join("")
        : q.opts.map(o => `<label class="op"><input type="radio" name="q${i}" value="${o.k}"> <b>${o.k}.</b> ${R(o.t)}</label>`).join("")) + 
      `</div>`).join("") +
      `<div class="row"><button onclick="submitQuiz()">Nộp bài</button><button class="g" onclick="go('list')">Thoát</button></div>`;
  } else if (S.view === "review") {
    const { score, right } = grade(S.qs, S.A);
    m.innerHTML = `<div class="card"><h2>${esc(S.quiz.title)}</h2><div class="score">${score}/10</div>
      <div class="mu">Đúng hoàn toàn ${right}/${S.qs.length} câu.</div>
      <p><label><input type="checkbox" ${S.onlyWrong ? "checked" : ""} onchange="S.onlyWrong=this.checked;renderMain()"> Chỉ hiện câu sai</label></p>
      <div class="row"><button onclick="take('${S.quiz.id}')">Làm lại</button><button class="g" onclick="go('list')">Về danh sách</button></div>${aiBlock()}</div>` +
      S.qs.map((q, i) => reviewQ(q, i)).join("");
  } else if (S.view === "live") {
    m.innerHTML = renderLive();
  } else if (S.view === "aiset") {
    if (!S.admin) return go("home");
    m.innerHTML = renderAiSet();
  } else if (S.view === "edit") {
    const q = S.quiz;
    m.innerHTML = `<div class="card"><h2>${q.id ? "Sửa bài" : "Thêm bài mới"}</h2>
      <p><label>Tên bài<input type="text" id="et" value="${esc(q.title)}"></label></p>
      <p><label>Môn học<select id="es">${S.subjects.map(s => `<option value="${s.id}" ${s.id === q.subject ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label></p>
      <p><label>Upload file .txt <input type="file" id="ef" accept=".txt"></label></p>
      <p><label>Nội dung đề<textarea id="ex">${esc(q.text)}</textarea></label></p>
      <div class="row"><button onclick="saveQuiz()">Lưu bài</button><button class="g" onclick="go('list')">Hủy</button></div></div>`;
    $("ef").onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = () => { $("ex").value = r.result; if (!$("et").value) $("et").value = f.name.replace(/\.txt$/i, ""); }; r.readAsText(f, "utf-8"); } };
  }
}

function reviewQ(q, i) {
  const A = S.A; let ok, body;
  if (q.sts.length) {
    ok = q.sts.every(s => A[i + s.k] === s.v);
    body = q.sts.map(s => {
      const a = A[i + s.k], good = a === s.v, lab = x => x === undefined ? "bỏ trống" : x ? "Đúng" : "Sai";
      return `<div class="st"><span><b>${s.k})</b> ${R(s.t)}</span><span class="${good ? "tag-ok" : "tag-no"}">${good ? "✓" : "✗"} Bạn chọn: ${lab(a)}${good ? "" : " · Đáp án: " + lab(s.v)}</span></div>`;
    }).join("");
  } else {
    ok = A[i] === q.ans;
    body = q.opts.map(o => {
      const c = o.k === q.ans ? "right" : (o.k === A[i] ? "wrong" : "");
      return `<div class="op ${c}">${o.k}. ${R(o.t)} ${o.k === q.ans ? `<span class="tag-ok">✓ đáp án đúng</span>` : o.k === A[i] ? `<span class="tag-no">✗ bạn chọn</span>` : ""}</div>`;
    }).join("") + (A[i] === undefined ? `<div class="tag-no">Bạn chưa trả lời câu này.</div>` : "");
  }
  if (S.onlyWrong && ok) return "";
  return `<div class="card q ${ok ? "ok" : "bad"}"><b>Câu ${i + 1}.</b> ${R(q.q)} <span class="${ok ? "tag-ok" : "tag-no"}">${ok ? "Đúng" : "Sai"}</span>${body}${!ok && aiReady() ? aiBtnQ(i) : ""}</div>`;
}

function renderBoard() {
  const rows = S.results.slice(0, 200);
  $("board").innerHTML = `<h3>Bảng kết quả</h3>` + (rows.length ? `<div class="tw"><table><tr><th>#</th><th>Người làm</th><th>Bài</th><th>Điểm</th><th>Lúc</th>${S.admin ? "<th></th>" : ""}</tr>` +
    rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.quiz)}</td><td><b>${r.score}</b>/10</td><td>${new Date(r.time).toLocaleString("vi-VN")}</td>${S.admin ? `<td><button class="d" onclick="delRes('${r.id}')">Xóa</button></td>` : ""}</tr>`).join("") + `</table></div>` : `<p class="mu">Chưa có ai làm bài.</p>`);
}

function take(id) {
  S.quiz = S.quizzes.find(q => q.id === id);
  if (!S.quiz) return go("list");
  S.qs = parse(S.quiz.text).qs; S.A = {}; S.onlyWrong = false; S.aiCache = {}; S.aiBusy = {};
  S.view = "take"; renderSide(); renderMain(); window.scrollTo(0, 0);
  const sb = S.subjects.find(x => x.id === S.quiz.subject);
  liveSend({ state: "doing", quiz: S.quiz.title, subject: sb ? sb.name : null, since: Date.now() });
}
function submitQuiz() {
  const A = {}; let miss = 0;
  S.qs.forEach((q, i) => {
    if (q.sts.length) q.sts.forEach(s => { const r = document.querySelector(`input[name="q${i}${s.k}"]:checked`); if (r) A[i + s.k] = r.value === "1"; else miss++; });
    else { const r = document.querySelector(`input[name="q${i}"]:checked`); if (r) A[i] = r.value; else miss++; }
  });
  if (miss && !confirm(`Còn ${miss} ý/câu chưa trả lời. Vẫn nộp bài?`)) return;
  S.A = A;
  const { score } = grade(S.qs, A);
  if (!S.admin) store.put("results", { id: uid(), name: S.user, quiz: S.quiz.title, quizId: S.quiz.id, score, time: Date.now() });
  liveSend(LIVE_IDLE);
  S.view = "review"; renderMain(); window.scrollTo(0, 0);
}

function addSub() { const n = prompt("Tên môn mới:"); if (n && n.trim()) store.put("subjects", { id: uid(), name: n.trim(), o: Date.now() }); }
function renameSub() { const s = S.subjects.find(x => x.id === S.sub); const n = prompt("Tên mới:", s.name); if (n && n.trim()) store.put("subjects", { ...s, name: n.trim() }); }
function delSub() {
  const s = S.subjects.find(x => x.id === S.sub);
  if (!confirm(`Xóa môn “${s.name}”?`)) return;
  S.quizzes.filter(q => q.subject === s.id).forEach(q => store.del("quizzes", q.id));
  store.del("subjects", s.id); S.sub = null; go("home");
}
function editQuiz(id) {
  S.quiz = id ? { ...S.quizzes.find(q => q.id === id) } : { id: "", subject: S.sub, title: "", text: "" };
  S.view = "edit"; renderMain(); window.scrollTo(0, 0);
}
function saveQuiz() {
  const title = $("et").value.trim(), text = $("ex").value, r = parse(text);
  if (!title) return alert("Hãy nhập tên bài.");
  if (!r.qs.length) return alert("Chưa có câu hỏi hợp lệ nào.");
  S.sub = $("es").value;
  store.put("quizzes", { id: S.quiz.id || uid(), subject: S.sub, title, text, imgs: S.quiz.imgs || {}, time: S.quiz.time || Date.now() })
    .then(() => go("list")).catch(e => alert("Lỗi: " + e.message));
}
function delQuiz(id) { if (confirm("Xóa bài này?")) store.del("quizzes", id); }
function delRes(id) { if (confirm("Xóa dòng kết quả này?")) store.del("results", id); }
</script>
</body>
</html>
