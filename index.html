<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Homework</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --txt: #0f172a;
      --sub: #475569;
      --bd: #e2e8f0;
      --pr: #2563eb;
      --prh: #1d4ed8;
      --ok: #16a34a;
      --okb: #f0fdf4;
      --no: #dc2626;
      --nob: #fef2f2;
      --hd: #1e293b;
      --hdt: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --txt: #f8fafc;
        --sub: #94a3b8;
        --bd: #334155;
        --pr: #3b82f6;
        --prh: #2563eb;
        --ok: #22c55e;
        --okb: #052e16;
        --no: #ef4444;
        --nob: #450a0a;
        --hd: #020617;
        --hdt: #f8fafc;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--txt); line-height: 1.5; }
    
    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--hd); color: var(--hdt); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    .main-layout { display: flex; flex: 1; }
    aside { width: 260px; background: var(--card); border-right: 1px solid var(--bd); padding: 16px; flex-shrink: 0; }
    main { flex: 1; padding: 24px; max-width: 900px; margin: 0 auto; width: 100%; }

    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      aside { width: 100%; border-right: none; border-bottom: 1px solid var(--bd); }
    }

    /* UI Components */
    .btn { background: var(--pr); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    .btn:hover { background: var(--prh); }
    .btn-sec { background: transparent; color: var(--txt); border: 1px solid var(--bd); }
    .btn-sec:hover { background: var(--bd); }
    .btn-danger { background: var(--no); color: #fff; }
    .input { width: 100%; padding: 8px 12px; border: 1px solid var(--bd); border-radius: 6px; background: var(--card); color: var(--txt); margin-bottom: 12px; }

    /* Card & Quiz Elements */
    .card { background: var(--card); border: 1px solid var(--bd); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .q-title { font-weight: 600; margin-bottom: 12px; }
    .opt { display: block; padding: 10px 14px; border: 1px solid var(--bd); border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .opt:hover { border-color: var(--pr); }
    .opt input { margin-right: 8px; }

    /* --- Tùy chỉnh giao diện nút Đúng / Sai --- */
    .st {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-top: 1px dashed var(--bd);
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .st-text {
      flex: 1;
      font-size: 0.95rem;
    }
    .st-opts {
      display: flex;
      gap: 8px;
    }
    .st label {
      margin-left: 0;
      white-space: nowrap;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--bd);
      background: var(--card);
      transition: all 0.2s ease;
      user-select: none;
    }
    .st label:hover {
      border-color: var(--pr);
    }
    .st input[type="radio"] {
      accent-color: var(--pr);
    }
    .st label:has(input[value="1"]:checked) {
      background: var(--okb);
      border-color: var(--ok);
      color: var(--ok);
      font-weight: 700;
    }
    .st label:has(input[value="0"]:checked) {
      background: var(--nob);
      border-color: var(--no);
      color: var(--no);
      font-weight: 700;
    }

    /* AI Explanation */
    .ai-box { background: var(--bg); border-left: 4px solid var(--pr); padding: 12px 16px; border-radius: 0 6px 6px 0; margin-top: 12px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Lunar Homework</h1>
      <div id="auth-status"></div>
    </header>
    <div class="main-layout">
      <aside id="side-nav"></aside>
      <main id="main-content"></main>
    </div>
  </div>

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    /* ===================== CONFIG & INITIALIZATION ===================== */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();

    const S = {
      admin: false,
      user: null,
      view: 'home',
      ai: { enabled: true, provider: 'gemini', model: 'gemini-2.5-flash', hasKey: false }
    };

    const store = {
      async get(col, id) {
        try {
          const doc = await db.collection(col).doc(id).get();
          return doc.exists ? doc.data() : null;
        } catch(e) { return null; }
      }
    };

    /* ===================== AI & FALLBACK MODEL ===================== */
    const AI_DEF = { 
      gemini: { name: "Google Gemini", model: "gemini-2.5-flash" }, 
      openai: { name: "OpenAI", model: "gpt-4o-mini" }, 
      claude: { name: "Anthropic Claude", model: "claude-haiku-5-5" } 
    };

    const GEMINI_FALLBACK_MODELS = [
      "gemini-2.5-flash",
      "gemini-1.5-flash",
      "gemini-1.5-flash-8b"
    ];

    const AI_SYS = "Bạn là giáo viên hỗ trợ học sinh lớp 11 ở Việt Nam. Trả lời bằng tiếng Việt, ngắn gọn, dễ hiểu, thân thiện. Coi 'Đáp án đề' là đáp án chính thức; nếu thấy đáp án đề có vẻ sai thì nói rõ nhưng đừng khẳng định chắc chắn. Không bịa; nếu câu có hình minh họa mà bạn không xem được thì nói là chưa đủ thông tin cho phần đó. Dùng **in đậm** cho ý chính, không dùng bảng.";

    const aiReady = () => !!(S.ai && S.ai.enabled && S.ai.hasKey && AI_DEF[S.ai.provider]);

    async function aiCallSingle(system, user, provider, model, key) {
      const J = { "Content-Type": "application/json" };
      let r, d;
      if (provider === "openai") {
        r = await fetch("https://api.openai.com/v1/chat/completions", { 
          method: "POST", 
          headers: { ...J, Authorization: "Bearer " + key }, 
          body: JSON.stringify({ model, messages: [{ role: "system", content: system }, { role: "user", content: user }] }) 
        });
        d = await r.json(); if (!r.ok) throw new Error((d.error && d.error.message) || r.status);
        return d.choices[0].message.content;
      }
      if (provider === "claude") {
        r = await fetch("https://api.anthropic.com/v1/messages", { 
          method: "POST", 
          headers: { ...J, "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, 
          body: JSON.stringify({ model, max_tokens: 2000, system, messages: [{ role: "user", content: user }] }) 
        });
        d = await r.json(); if (!r.ok) throw new Error((d.error && d.error.message) || r.status);
        return d.content.map(c => c.text || "").join("");
      }
      // Gemini Default Call
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { 
        method: "POST", 
        headers: { ...J, "x-goog-api-key": key }, 
        body: JSON.stringify({ 
          systemInstruction: { parts: [{ text: system }] }, 
          contents: [{ role: "user", parts: [{ text: user }] }], 
          generationConfig: { temperature: 0.4 } 
        }) 
      });
      d = await r.json(); if (!r.ok) throw new Error((d.error && d.error.message) || r.status);
      const c = (d.candidates || [])[0] && d.candidates[0].content;
      if (!c || !c.parts) throw new Error("AI không trả về nội dung.");
      return c.parts.map(x => x.text || "").join("");
    }

    async function aiCall(system, user, o) {
      if (!o) { 
        const sec = await store.get("secrets", "ai"); 
        o = { provider: S.ai.provider, model: S.ai.model, key: sec && sec.key }; 
      }
      if (!o.key) throw new Error("Chưa có key API.");

      if (o.provider !== "gemini") {
        return await aiCallSingle(system, user, o.provider, o.model, o.key);
      }

      let modelsToTry = [o.model, ...GEMINI_FALLBACK_MODELS];
      modelsToTry = [...new Set(modelsToTry)];

      let lastError = null;
      for (const mdl of modelsToTry) {
        try {
          const res = await aiCallSingle(system, user, "gemini", mdl, o.key);
          return res;
        } catch (err) {
          lastError = err;
          console.warn(`Model ${mdl} gặp lỗi, chuyển sang model dự phòng tiếp theo...`, err);
        }
      }
      throw new Error(lastError ? lastError.message : "Tất cả các model Gemini đều không phản hồi.");
    }

    /* ===================== RENDER HELPERS ===================== */
    function renderSide() {
      const side = document.getElementById('side-nav');
      side.innerHTML = `
        <div style="margin-bottom: 20px;">
          <p style="font-weight: 600;">Menu</p>
          <button class="btn btn-sec" style="width: 100%; margin-top: 8px; text-align: left;" onclick="S.view='home'; renderMain();">Trang chủ</button>
          ${S.admin ? `<button class="btn btn-sec" style="width: 100%; margin-top: 8px; text-align: left;" onclick="S.view='live'; renderMain();">✓ Ai đang làm bài</button>` : ''}
        </div>
      `;
    }

    function renderMain() {
      const main = document.getElementById('main-content');
      if (S.view === 'home') {
        main.innerHTML = `
          <div class="card">
            <h2>Bài tập trắc nghiệm mẫu</h2>
            <p style="margin: 8px 0 16px; color: var(--sub);">Dưới đây là ví dụ giao diện câu hỏi Đúng / Sai với thiết kế nút bấm mới.</p>
            
            <!-- Ví dụ Câu hỏi Đúng/Sai -->
            <div style="border-top: 1px solid var(--bd); padding-top: 16px;">
              <div class="q-title">Câu 1: Cho hàm số $y = f(x)$. Xét tính đúng/sai của các phát biểu sau:</div>
              
              <div class="st">
                <span class="st-text">a) Hàm số đồng biến trên khoảng $(0; +\infty)$</span>
                <div class="st-opts">
                  <label><input type="radio" name="q1_a" value="1"> Đúng</label>
                  <label><input type="radio" name="q1_a" value="0"> Sai</label>
                </div>
              </div>

              <div class="st">
                <span class="st-text">b) Đồ thị hàm số đi qua điểm $A(1; 2)$</span>
                <div class="st-opts">
                  <label><input type="radio" name="q1_b" value="1"> Đúng</label>
                  <label><input type="radio" name="q1_b" value="0"> Sai</label>
                </div>
              </div>

              <div class="st">
                <span class="st-text">c) Giá trị cực đại của hàm số là $y = -1$</span>
                <div class="st-opts">
                  <label><input type="radio" name="q1_c" value="1"> Đúng</label>
                  <label><input type="radio" name="q1_c" value="0"> Sai</label>
                </div>
              </div>
            </div>

            <button class="btn" style="margin-top: 16px;" onclick="testAI()">Thử gọi AI Giải thích</button>
            <div id="ai-res"></div>
          </div>
        `;
      } else if (S.view === 'live') {
        main.innerHTML = `<div class="card"><h2>Danh sách học sinh đang làm bài</h2><p>Đang tải dữ liệu...</p></div>`;
      }
    }

    async function testAI() {
      const target = document.getElementById('ai-res');
      target.innerHTML = '<div class="ai-box">Đang gọi AI (có fallback)...</div>';
      try {
        // Tải key thử nghiệm hoặc dùng key mẫu
        const res = await aiCall(AI_SYS, "Giải thích ngắn gọn tại sao 1+1=2.");
        target.innerHTML = `<div class="ai-box"><b>AI Trả lời:</b><br>${res}</div>`;
      } catch (e) {
        target.innerHTML = `<div class="ai-box" style="border-color: var(--no);"><b>Lỗi:</b> ${e.message}</div>`;
      }
    }

    /* Initialize app UI */
    auth.onAuthStateChanged(user => {
      S.user = user;
      S.admin = !!user;
      document.getElementById('auth-status').innerText = user ? `Admin: ${user.email}` : 'Khách';
      renderSide();
      renderMain();
    });
  </script>
</body>
</html>
