<style>
:root{--bg:#e8ecf6;--card:#fff;--tx:#141941;--mu:#626892;--pr:#3d42c9;--prt:#3d42c9;--moon:#f4bf4f;--ok:#12805c;--okb:#dcf5ea;--no:#d23a45;--nob:#fde8ea;--bd:#d6dbec;--night:#10133a;--hf:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
--stars:radial-gradient(1.5px 1.5px at 8% 18%,#fff 60%,transparent 62%),radial-gradient(1px 1px at 22% 62%,#fffc 60%,transparent 62%),radial-gradient(1.5px 1.5px at 41% 28%,#fff 60%,transparent 62%),radial-gradient(1px 1px at 63% 14%,#fffc 60%,transparent 62%),radial-gradient(2px 2px at 78% 42%,#fff 60%,transparent 62%),radial-gradient(1px 1px at 91% 76%,#fffc 60%,transparent 62%),radial-gradient(1px 1px at 55% 82%,#fff9 60%,transparent 62%),radial-gradient(1px 1px at 30% 90%,#fff9 60%,transparent 62%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f2e;--card:#171b45;--tx:#e9ebff;--mu:#9aa0d0;--pr:#6b70f2;--prt:#aeb1ff;--ok:#4cd9a0;--okb:#123a30;--no:#ff8088;--nob:#47202c;--bd:#2c3169;--night:#070920}}
:root[data-theme="dark"]{--bg:#0c0f2e;--card:#171b45;--tx:#e9ebff;--mu:#9aa0d0;--pr:#6b70f2;--prt:#aeb1ff;--ok:#4cd9a0;--okb:#123a30;--no:#ff8088;--nob:#47202c;--bd:#2c3169;--night:#070920;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.6 "Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
body:has(#login:not([hidden])){background:var(--stars),linear-gradient(180deg,#0b0e32,#1a1f6e 62%,#2b2f93);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--hf);letter-spacing:-.01em}
h2,h3{margin:.2em 0 .5em}
h2{font-size:1.5rem;font-weight:700}

/* header */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;background:var(--stars),linear-gradient(100deg,#0e1137,#1f2478);color:#fff;border-bottom:2px solid rgba(244,191,79,.45)}
body:has(#login:not([hidden])) header{background:transparent;border-color:transparent}
header h1{margin:0;font:800 1.35rem/1 var(--hf);letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:#fbfdf2;object-fit:cover;box-shadow:0 0 0 2px var(--moon);flex:none}
.logo-lg{display:block;width:120px;height:120px;margin:-70px auto 14px;border-radius:50%;object-fit:cover;background:#fbfdf2;box-shadow:0 0 0 4px var(--moon),0 10px 34px rgba(244,191,79,.4)}
#who{font-size:.9rem;display:flex;gap:10px;align-items:center}

/* buttons */
button{background:var(--pr);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;transition:transform .12s,filter .15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button:active{transform:none}
button:disabled{opacity:.5;cursor:default;transform:none;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--moon) 75%,transparent);outline-offset:2px}
button.g{background:transparent;color:var(--prt);border:1.5px solid color-mix(in srgb,var(--prt) 55%,transparent)}
button.d{background:#c9323d;color:#fff}
header button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff}
.ai-btn{display:inline-flex;align-items:center;gap:8px}
input[type=text],input[type=password],select,textarea{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);transition:border-color .15s}
input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:var(--moon)}
textarea{min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
details.card summary{cursor:pointer}

/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;margin-bottom:14px}
#main .card>b:first-child{font-family:var(--hf);color:var(--prt)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:.9rem}

/* login */
#login{max-width:440px;margin:90px auto 60px;padding:0 16px}
#login .card{border:0;border-radius:26px;padding:1px 28px 26px;box-shadow:0 26px 60px rgba(5,7,40,.5)}
#login h2{margin:.1em 0 .3em;text-align:center;font-size:1.4rem}
#login .mu{text-align:center}
#login input[type=password]{border-radius:12px!important;border-width:1.5px!important}
#login button{width:100%;margin-top:6px;padding:13px;background:var(--moon);color:#171a4a;font-size:1rem}
#err{color:var(--no);min-height:1.5em;margin:8px 0 0;text-align:center}

/* layout + sidebar */
#app{display:grid;grid-template-columns:240px 1fr;gap:20px;max-width:1120px;margin:20px auto;padding:0 16px;align-items:start}
aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;border-radius:22px}
aside .card{padding:10px;margin:0;background:linear-gradient(180deg,#171a52,#0f1239);border:1px solid rgba(255,255,255,.08);border-radius:22px;color:#e9ebff}
aside button.s{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;color:#dfe2ff;margin:2px 0;padding:10px 14px;border-radius:14px;font-weight:500}
aside button.s:hover{background:rgba(255,255,255,.08);transform:none;filter:none}
aside button.s.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--moon)}
aside small{color:inherit;opacity:1;background:rgba(255,255,255,.14);padding:0 8px;border-radius:999px;font-size:.75rem;line-height:1.6}
aside hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:8px 6px}
aside .mu{color:#a9aee0}

/* câu hỏi + phương án */
.op{display:block;padding:10px 14px;margin:6px 0;border-radius:12px;border:1.5px solid var(--bd);cursor:pointer;transition:border-color .12s,background .12s}
div.op{cursor:default}
.op:hover{border-color:var(--pr)}
.op:has(input:checked){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 9%,var(--card))}
.op input{accent-color:var(--pr);margin-right:8px}
.q.ok{border-left:6px solid var(--ok)}
.q.bad{border-left:6px solid var(--no)}
.op.right{background:linear-gradient(135deg,var(--okb),color-mix(in srgb,var(--okb) 72%,var(--card)));border:1.5px solid var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.op.wrong{background:linear-gradient(135deg,var(--nob),color-mix(in srgb,var(--nob) 72%,var(--card)));border:1.5px solid var(--no);box-shadow:inset 4px 0 0 var(--no)}

/* câu đúng/sai: hai nút cố định */
.st{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--bd)}
.st>span:first-child{min-width:0;overflow-wrap:anywhere}
#ntov,#wnov,#pkov{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,40,.62)}
#wnov{z-index:1001}
#pkov .card{max-height:92vh;overflow:auto}
#ntov .card,#wnov .card,#pkov .card{max-width:480px;width:100%;margin:0;box-shadow:0 24px 60px rgba(5,7,40,.5)}
#wnov .card.wide{max-width:640px}
#ntov .nt-body,#wnov .nt-body{white-space:pre-wrap;max-height:50vh;overflow:auto;overflow-wrap:anywhere}
.pl tr.flag td{background:rgba(224,60,60,.13)}
.pl .gp{border:1.5px solid var(--no);border-radius:12px;padding:12px 14px;margin:10px 0;background:rgba(224,60,60,.06)}
.pl .gp ul{margin:6px 0 10px;padding-left:20px}
.pl code{font-size:.82em;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border:1.5px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);font-weight:600;font-size:.88rem}
.chip small{opacity:.65;font-weight:500}
.chip:hover{border-color:var(--pr);transform:translateY(-1px)}
.chip.on{border-color:var(--pr);background:var(--pr);color:#fff}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bdg{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;font-size:.7rem;font-weight:800;vertical-align:middle;letter-spacing:.03em}
.bdg.new{background:var(--moon);color:#3a2a00}.bdg.old{background:color-mix(in srgb,var(--mu) 18%,var(--card));color:var(--mu)}.bdg.grp{background:color-mix(in srgb,var(--pr) 14%,var(--card));color:var(--prt)}
.adm-h{margin:12px 10px 2px;font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a9aee0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.tiles.t4{grid-template-columns:repeat(4,1fr)}@media(max-width:700px){.tiles,.tiles.t4{grid-template-columns:repeat(2,1fr)}}
.tile{display:block;text-align:left;background:color-mix(in srgb,var(--pr) 6%,var(--card));color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;font-weight:500}
.tile b{display:block;font:700 1.6rem var(--hf);color:var(--prt);line-height:1.15}.tile span{color:var(--mu);font-size:.85rem}
button.tile:hover{border-color:var(--pr);transform:translateY(-1px)}
.adm-al{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:8px 0;padding:10px 14px;border:1.5px solid var(--no);border-radius:12px;background:var(--nob)}
.adm-al.w{border-color:var(--moon);background:color-mix(in srgb,var(--moon) 16%,var(--card))}
.adm-al button{padding:4px 14px}
details.more{position:relative}details.more>summary{list-style:none;cursor:pointer;padding:9px 16px;border:1.5px solid color-mix(in srgb,var(--prt) 55%,transparent);border-radius:999px;color:var(--prt);font-weight:700;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:flex;flex-direction:column;gap:6px;min-width:170px;padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 30px rgba(10,12,50,.25)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
.fgrid label,.fsec>label{display:block;font-weight:600;font-size:.9rem}.fgrid input,.fgrid select,.fsec>label input,.fsec>label textarea{margin-top:4px;font-weight:400}
.fsec{margin:0 0 12px}.fsec>b{display:block;margin-bottom:6px}
.fbtn{display:inline-flex;align-items:center;gap:6px;margin:0;padding:9px 18px;border:1.5px solid color-mix(in srgb,var(--prt) 55%,transparent);border-radius:999px;color:var(--prt);font-weight:600;cursor:pointer}
.savebar{position:sticky;bottom:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:10px 14px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(6px);border:1px solid var(--bd);border-radius:16px;box-shadow:0 -6px 20px rgba(10,12,50,.12)}
details.card>summary{cursor:pointer}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.scard{display:block;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-weight:500}
.scard b{display:block;font:700 1.05rem var(--hf);color:var(--tx)}.scard span,.scard small{display:block;color:var(--mu);font-size:.84rem}
.scard .pb{margin:8px 0 4px}.scard:hover{border-color:var(--pr);transform:translateY(-1px)}
.lrow{padding:10px 0;border-top:1px solid var(--bd);margin-top:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.seg .chip{font-weight:600}
.qn{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qn button{width:38px;height:38px;padding:0;border-radius:10px;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);font-weight:600;font-size:.88rem}
.qn button:hover{border-color:var(--pr);transform:none}
.qn button.done{background:var(--pr);border-color:var(--pr);color:#fff}
.qn button.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.qn button.bad{background:var(--nob);border-color:var(--no);color:var(--no)}
.qcard{scroll-margin-top:16px}
.resgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}@media(max-width:560px){.resgrid{grid-template-columns:1fr}}
.rs{background:color-mix(in srgb,var(--pr) 6%,var(--card));border:1px solid var(--bd);border-radius:14px;padding:10px 14px}
.rs b{display:block;font:800 1.7rem/1.15 var(--hf);color:var(--prt)}.rs span{color:var(--mu);font-size:.85rem}
#board tr.me td{background:color-mix(in srgb,var(--pr) 10%,var(--card));font-weight:600}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.pickgrid{grid-template-columns:1fr}}
.gchk{display:flex;flex-wrap:wrap;gap:8px}.gchk label{display:inline-flex;align-items:center;gap:6px;margin:0;padding:5px 12px;border:1.5px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);cursor:pointer;font-weight:600;font-size:.88rem}.gchk label:has(input:checked){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card))}.gchk input{accent-color:var(--pr);margin:0}
.done{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:8px;border-radius:50%;background:var(--ok);color:#fff;font-size:.8rem;font-weight:800;vertical-align:middle}
.tg{padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--pr) 12%,var(--card));color:var(--pr);font-size:.78rem;font-weight:700}
.st .tf-options{display:grid;grid-template-columns:104px 104px;gap:12px;justify-content:end}
.st .tf-choice{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:104px;margin:0;padding:7px 13px;border:1.5px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);font-weight:600;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;white-space:nowrap}
.st .tf-choice:hover{transform:translateY(-1px);border-color:var(--pr)}
.st .tf-choice input{accent-color:var(--pr);margin:0;width:16px;height:16px}
.st .tf-choice:has(input:checked){border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card));box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 12%,transparent)}
.st .tf-choice.yes:has(input:checked){border-color:var(--ok);background:var(--okb);color:var(--ok)}
.st .tf-choice.no:has(input:checked){border-color:var(--no);background:var(--nob);color:var(--no)}
@media(max-width:560px){.st{grid-template-columns:1fr;gap:8px}.st .tf-options{grid-template-columns:1fr 1fr;justify-content:stretch}.st .tf-choice{width:auto}}

/* kết quả, bảng, thống kê */
.tag-ok{color:var(--ok);font-weight:700}.tag-no{color:var(--no);font-weight:700}
.score{font:800 3.2rem/1 var(--hf);color:var(--prt);margin:.1em 0 .2em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
#board .tw{max-height:min(420px,60vh);overflow:auto;border:1px solid var(--bd);border-radius:12px;scrollbar-width:thin;overscroll-behavior:contain}
#board th{position:sticky;top:0;z-index:1;background:var(--card);box-shadow:0 1px 0 var(--bd)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font:600 .82rem var(--hf);color:var(--mu);background:color-mix(in srgb,var(--bd) 35%,transparent)}
tr:hover td{background:color-mix(in srgb,var(--pr) 5%,transparent)}
td:nth-child(3){white-space:normal}
.qi{display:block;max-width:100%;max-height:340px;margin:8px 0;border-radius:10px;border:1px solid var(--bd);background:#fff}
.op .qi{display:inline-block;vertical-align:middle;margin:4px 0 4px 8px;max-height:200px}
.pb{height:8px;min-width:80px;background:var(--bd);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--mu)}.dot.on{background:var(--ok)}.dot.aw{background:#e0a100}
.thumb{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--bd)}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#fff}
pre{background:var(--bg);padding:12px;border-radius:12px;overflow-x:auto;font-size:.85rem}
.ai{background:color-mix(in srgb,var(--pr) 7%,var(--card));border-left:4px solid var(--moon);border-radius:12px;padding:12px 16px;margin:10px 0;line-height:1.7}
.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}

/* thanh tiến độ mặt trăng khi làm bài */
.mphase{--p:0;position:relative;display:inline-block;width:30px;height:30px;border-radius:50%;background:#23286b;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.mphase::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--moon);transform:translateX(calc((var(--p) - 1) * 100%));transition:transform .4s}
.mphase.full{box-shadow:0 0 0 2px var(--moon),0 0 16px 2px rgba(244,191,79,.6)}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:var(--night);color:#fff;border-radius:999px;box-shadow:0 10px 30px rgba(8,10,40,.4);font:600 .95rem var(--hf);white-space:nowrap}
.dock button{background:var(--moon);color:#171a4a}
.dock .tm{font-variant-numeric:tabular-nums;color:var(--moon);min-width:78px}
.dock .tm.low{color:#ff8088;animation:tmb 1s infinite}
@keyframes tmb{50%{opacity:.55}}
#main:has(.dock){padding-bottom:84px}

/* thông báo */
.warn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;max-width:min(92vw,520px);background:#c9323d;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 6px 24px #0005;font-weight:700;text-align:center;cursor:pointer;animation:wp .25s}
@keyframes wp{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:720px){#app{grid-template-columns:1fr}aside{position:static;max-height:none}header{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.cl:hover{background:color-mix(in srgb,var(--pr) 10%,transparent);transform:none;filter:none}

function findStudent(input) {

}

const HELP = `Câu 1: Thủ đô của Việt Nam là gì?

Câu 3: Nước sôi ở bao nhiêu độ C (áp suất thường)?
Đáp án: 100`;

function parse(text) {
  const qs = [], errors = [];
  let cur = null, m;
  String(text).split(/\r?\n/).forEach(raw => {
    const l = raw.trim();
    if (!l) return;
    if ((m = l.match(/^C[âa]u\s*(\d*)\s*[:.)]\s*(.*)$/i))) { cur = { n: m[1], q: m[2], opts: [], sts: [], ans: null, raw: "" }; qs.push(cur); }
    else if (!cur) return;
    // ý đúng/sai: a) b) c) d), A. B. C. D. hoặc I. II. III. IV. kết thúc bằng "= Đ" / "= S" (đặt TRƯỚC nhánh phương án A-D)
    else if ((m = l.match(/^([a-d])[.)]\s*(.*?)\s*(?:=|\|)\s*(Đ|đ|S|s)$/)) || (m = l.match(/^([A-D]|IV|III|II|I)[.)]\s*(.*?)\s*(?:=|\|)\s*(Đ|đ|S)$/))) cur.sts.push({ k: m[1], t: m[2], v: m[3].toUpperCase() === "Đ" });
    else if ((m = l.match(/^([A-D])[.)]\s*(.*)$/))) cur.opts.push({ k: m[1], t: m[2] });
    else if ((m = l.match(/^(?:Đáp án|Dap an|ĐA|DA)\s*[:.]\s*(.*)$/i))) {
      const v = m[1].trim(), L = v.match(/^([A-Da-d])(?![\p{L}\p{N}])/u);
      if (L) cur.ans = L[1].toUpperCase(); else cur.raw = v; // raw: đáp án viết bằng nội dung (vd "2", "Hình 3") hoặc câu trả lời ngắn
    }
    else cur.q += " " + l;
  });
  // chuẩn hóa
  qs.forEach(q => {
    // câu A-D có "Đáp án: X" nhưng mỗi dòng dính "= Đ/S": coi là 4 phương án trắc nghiệm
    if (q.ans && q.sts.length && !q.opts.length && q.sts.every(s => /^[A-D]$/.test(s.k)) && q.sts.some(s => s.k === q.ans)) {
      q.opts = q.sts.map(s => ({ k: s.k, t: s.t })); q.sts = [];
    }
    // câu đúng/sai: đổi nhãn (I, II, A, B...) về a, b, c, d để hiển thị và chấm điểm
    q.sts.forEach((s, i) => { s.k = String.fromCharCode(97 + i); });
    // đáp án viết bằng nội dung phương án (vd "Đáp án: 2" hoặc "Đáp án: Hình 3") → đổi về chữ cái
    if (!q.ans && q.opts.length >= 2 && q.raw) {
      const t = saNorm(q.raw), o = q.opts.find(o => saNorm(o.t) === t);
      if (o) q.ans = o.k;
    }
    // câu trả lời ngắn: không có phương án, không có ý a-d, chỉ có "Đáp án: ..." (bỏ qua chỗ trống …… chưa điền)
    if (!q.opts.length && !q.sts.length && q.raw && !/^[\s.…_\-–—]*$/.test(q.raw)) q.sa = q.raw;
  });
  const ok = [];
  qs.forEach((q, i) => {
    const lab = "Câu " + (q.n || i + 1) + " (“" + String(q.q).replace(/\[(?:ảnh|anh|img)\s*:[^\]]*\]/gi, "").trim().slice(0, 30) + "…”)";
    if (q.sts.length >= 2 || q.sa !== undefined) ok.push(q);
    else if (q.opts.length >= 2 && q.ans && q.opts.some(o => o.k === q.ans)) ok.push(q);
    else errors.push(lab + ": " + (
      q.sts.length === 1 ? "chỉ có 1 ý đúng/sai, cần ít nhất 2 ý" :
      q.opts.length >= 2 ? (q.ans ? "đáp án " + q.ans + " không có trong các phương án" : q.raw ? "đáp án “" + q.raw + "” không khớp phương án nào" : "thiếu dòng “Đáp án: A/B/C/D”") :
      q.opts.length === 1 ? "chỉ có 1 phương án" :
      q.raw ? "dòng “Đáp án:” chưa có đáp án" : "không có phương án A–D, ý a)–d) hay dòng “Đáp án:”"));
  });
  return { qs: ok, errors };
}
// chuẩn hóa để so sánh đáp án ngắn: bỏ khoảng trắng, đổi dấu phẩy thành chấm, bỏ dấu chấm cuối
function saNorm(s) { return String(s).toLowerCase().normalize("NFC").replace(/\s+/g, "").replace(/,/g, ".").replace(/[.。]+$/, ""); }
function saOk(q, a) {
  if (a === undefined) return false;
  const x = saNorm(a); if (!x) return false;
  return String(q.sa).split(/[;|]/).some(alt => { const y = saNorm(alt); if (!y) return false; if (x === y) return true; const ny = Number(y); if (!isFinite(ny)) return false; let nx = Number(x); if (!isFinite(nx)) { const u = x.match(/^(-?\d+(?:\.\d+)?)[a-zà-ỹ%°\/²³]+$/i); if (u) nx = Number(u[1]); } return isFinite(nx) && nx === ny; });
}

function grade(qs, A) {
  let sc = 0, right = 0;
  qs.forEach((q, i) => {
    if (q.sts.length) {
      const c = q.sts.filter(s => A[i + s.k] === s.v).length, n = q.sts.length;
      sc += n === 4 ? [0, .1, .25, .5, 1][c] : c / n;
      if (c === n) right++;
    } else if (q.sa !== undefined) { if (saOk(q, A[i])) { sc++; right++; } }
    else if (A[i] === q.ans) { sc++; right++; }
  });
  return { score: Math.round(sc / qs.length * 100) / 10, right };
}

const IMG_RE = /\[(?:ảnh|anh|img)\s*:\s*([^\]]+?)\s*\]/gi;
const ikey = id => String(id).trim().replace(/[^\w-]/g, "_");
const isUrl = v => /^https?:\/\//i.test(v);
const MATH_RE = /\$\$([\s\S]+?)\$\$|\$(?!\s)([^$\n]*?[^\s$])\$/g;
function mathHtml(src, disp) {
  try { if (window.katex) return katex.renderToString(src, { throwOnError: false, displayMode: disp, output: "html" }); } catch (e) {}
  return esc(disp ? "$$" + src + "$$" : "$" + src + "$");
}
function rt(text, imgs) {
  let out = "", last = 0, m; text = String(text); MATH_RE.lastIndex = 0;
  while ((m = MATH_RE.exec(text))) { out += rtp(text.slice(last, m.index), imgs); out += mathHtml(m[1] !== undefined ? m[1] : m[2], m[1] !== undefined); last = m.index + m[0].length; }
  return out + rtp(text.slice(last), imgs);
}
function rtp(text, imgs) {
  return esc(text).replace(/-&gt;/g, "→").replace(/&lt;=&gt;/g, "⇌").replace(IMG_RE, (_, id) => {
    id = id.trim();
    const src = isUrl(id.replace(/&amp;/g, "&")) ? id : (imgs || {})[ikey(id)];
    return src ? `<img class="qi" src="${src}" alt="Hình minh họa" loading="lazy">` : `<span class="tag-no">[thiếu ảnh ${id}]</span>`;
  });
}

function compress(file, max = 800, quality = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", quality));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Không đọc được ảnh")); };
    im.src = url;
  });
}

async function aiCall(system, user, o, imgs, json) {

    return await aiCallSingle(system, user, { ...o, model: primary });

const PG_SYS = "Bạn chuyển ảnh chụp MỘT trang đề trắc nghiệm tiếng Việt thành JSON. Chỉ trả JSON hợp lệ, không giải thích, không dùng ```.";
const PG_USER = (w, h, prov) => `Ảnh là một trang đề chụp bằng điện thoại (có thể nghiêng, có ngón tay, thấy lấp ló trang bên cạnh, có chữ viết tay/khoanh tròn của học sinh). Chỉ lấy câu hỏi của trang CHÍNH ở giữa ảnh; bỏ qua trang bên cạnh, số trang, tiêu đề đầu trang, chữ viết tay.
Trả về JSON:
{"questions":[{"type":"mcq|tf|short","stem":"đề dẫn đầy đủ (kể cả các ý I,II,III,IV hoặc gạch đầu dòng mô tả thí nghiệm)","options":{"A":"...","B":"...","C":"...","D":"..."},"statements":[{"k":"a","t":"...","v":true}],"answer":"B","fig_stem":[[ymin,xmin,ymax,xmax]],"fig_opt":{"A":[ymin,xmin,ymax,xmax]},"start_cut":false,"end_cut":false,"unsure":false}],"note":""}
Quy tắc:
- mcq: có options A–D, answer là 1 chữ cái. Đề hỏi “có bao nhiêu phát biểu đúng” với đáp án A.1 B.2 C.3 D.4 vẫn là mcq (các ý I–IV nằm trong stem). tf: đề cho các ý a) b) c) d) mỗi ý đúng/sai riêng (v=true nếu đúng). short: câu tính toán/điền đáp án, KHÔNG có phương án A–D và KHÔNG có ý a)–d); đề thường yêu cầu “nhập”/“làm tròn”/“bao nhiêu…”. Với short BẮT BUỘC tự giải và để answer là CHỈ giá trị cuối (số, dùng dấu chấm thập phân, không đơn vị, làm tròn đúng yêu cầu đề), ví dụ \"1406\"; nếu có nhiều đáp án chấp nhận thì ngăn bằng dấu “;”. Không bịa thêm phương án A–D cho câu short.
- Mọi câu phải có answer: tự giải để chọn đáp án đúng nhất; dấu khoanh/chữ viết tay chỉ để tham khảo vì có thể sai. Không chắc thì unsure=true.
- Công thức viết LaTeX trong $...$, hóa học $\\ce{H2SO4}$; bảng số liệu chuyển thành chữ.
- Hình vẽ/sơ đồ/đồ thị cần nhìn để làm bài: khung ôm sát hình (không lấy chữ của đề) đặt vào fig_stem (hình thuộc phần đề dẫn) hoặc fig_opt (hình nằm trong đáp án/ý). Tọa độ ${prov === "claude" ? `pixel (ảnh rộng ${w}, cao ${h}, gốc trên-trái)` : "chuẩn hóa 0–1000 (gốc trên-trái)"}. Không có hình thì [] hoặc {}.
- QUAN TRỌNG: nếu các đáp án A/B/C/D là HÌNH (mạch logic, sơ đồ, đồ thị, hình thí nghiệm...) thì để options là chuỗi rỗng "" và BẮT BUỘC điền khung riêng cho TỪNG đáp án vào fig_opt (đủ A, B, C, D). Hình/bảng nằm ở phần đề dẫn (bảng chân trị, đồ thị...) thì đưa vào fig_stem.
- Câu bắt đầu từ trang trước (thiếu phần đầu): start_cut=true. Câu bị cắt ở cuối trang (thiếu phần sau): end_cut=true. Vẫn ghi phần nhìn thấy.`;
function pageFigs(q, pi, im, prov) {

}
function mergePages(rs, prov) {

    const figs = pageFigs(q, pi, r.im, prov), last = out[out.length - 1];
    if (q.start_cut && last && last.end_cut) { // nối câu bị cắt giữa 2 trang
      last.stem = (last.stem || "") + (q.stem ? "\n" + q.stem : ""); last.options = { ...(last.options || {}), ...(q.options || {}) };

}
function qText(q, num) {

  const optFig = k => (q.figs || []).find(f => f.pos !== "de" && String(f.pos).toLowerCase() === String(k).toLowerCase());

  else if (Object.keys(opts).length >= 2) { Object.keys(opts).forEach(k => { let f = optFig(k); if (!f && T(opts[k]).length === 0) { f = { p: q.pg, b: null, pos: k }; (q.figs = q.figs || []).push(f); } t += `\n${k}. ${f ? alloc(f) + " " : ""}${T(opts[k])}`; }); t += `\nĐáp án: ${T(q.answer).charAt(0).toUpperCase()}`; }

    const text = qs.map(q => { num++; const t = qText(q, num); if (q.unsure || q.end_cut) unsure.push(num); (q.figs || []).forEach(f => { if (f.id) list.push({ id: f.id, src: PAGES[f.p], b: f.b, label: "Câu " + num + (f.pos !== "de" ? " – đáp án " + f.pos : "") + (f.b ? "" : " (AI chưa tìm được khung, hãy tự kéo)") }); }); return t; }).join("\n\n");
    ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, "") + "\n\n" : "") + text; prevQ();
    st.innerHTML = `<span class="tag-ok">Đã thêm ${qs.length} câu.</span> ` + (list.length ? `Đang mở bước kiểm tra ${list.length} hình…` : "");
    if (list.length) { await reviewFigs(list); if (S.quiz === quiz && $("ex")) prevQ(); }

/* ===================== NHẬT KÝ ĐẶT MẬT KHẨU + CẢNH CÁO (dev) ===================== */
// Mặc định mọi tài khoản học sinh KHÔNG có mật khẩu (chưa có bản ghi trong "profiles"). Chỉ khi học sinh tự đặt mới có.
// Mỗi lần đặt/đổi/xóa mật khẩu → ghi 1 dòng vào "pwlog" (tên, giờ, IP, mã thiết bị, trình duyệt). Dev xem ở mục Nhật ký mật khẩu.
// "Mã thiết bị" là mã ngẫu nhiên lưu trong trình duyệt: đáng tin hơn IP vì cả trường thường dùng chung 1 IP wifi.
function devId() {
  try { let d = localStorage.getItem("lh_dev"); if (!d) { d = "d" + uid() + uid(); localStorage.setItem("lh_dev", d); } return d; }
  catch (e) { return S._dev || (S._dev = "d" + uid() + uid()); }
}
async function getIP() {
  const ask = async (u, f) => { const c = new AbortController(), t = setTimeout(() => c.abort(), 4000); try { const r = await fetch(u, { signal: c.signal, cache: "no-store" }); return f(await r.text()) || ""; } finally { clearTimeout(t); } };
  try { const ip = await ask("https://api64.ipify.org?format=json", t => JSON.parse(t).ip); if (ip) return ip; } catch (e) {}
  try { const ip = await ask("https://www.cloudflare.com/cdn-cgi/trace", t => (t.match(/^ip=(.+)$/m) || [])[1]); if (ip) return ip; } catch (e) {}
  return "";
}
function uaShort() {
  const u = navigator.userAgent || "";
  const os = /Android/.test(u) ? "Android" : /iPhone|iPad|iPod/.test(u) ? "iOS" : /Windows/.test(u) ? "Windows" : /Mac OS/.test(u) ? "macOS" : /CrOS/.test(u) ? "ChromeOS" : /Linux/.test(u) ? "Linux" : "?";
  const br = /Edg\//.test(u) ? "Edge" : /OPR\/|Opera/.test(u) ? "Opera" : /Firefox\//.test(u) ? "Firefox" : /coc_coc/i.test(u) ? "CocCoc" : /Chrome\//.test(u) ? "Chrome" : /Safari\//.test(u) ? "Safari" : "?";
  return br + " · " + os + " · " + screen.width + "×" + screen.height;
}
async function logPw(action) { // không bao giờ chặn việc đặt mật khẩu nếu ghi log lỗi
  try {
    const ip = await getIP();
    await Promise.race([store.put("pwlog", { id: uid(), name: S.user, key: pkey(S.user), action, t: Date.now(), ip, dev: devId(), ua: uaShort() }), new Promise((_, rj) => setTimeout(() => rj(new Error("timeout")), 6000))]);
  } catch (e) { console.warn("pwlog", e); }
}
const fmtT = t => new Date(t).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });
const PW_SEEN = "lh_pwlog_seen";
const pwSeenT = () => { try { return +localStorage.getItem(PW_SEEN) || 0; } catch (e) { return S._pwSeen || 0; } };
const pwActive = () => S.pwlog.filter(x => x.action !== "remove" && !x.reset);            // mật khẩu HS đặt và chưa bị dev reset
const pwUnseen = () => { const s = pwSeenT(); return pwActive().filter(x => x.t > s); };
function pwSeen() { const t = S.pwlog.reduce((m, x) => Math.max(m, x.t || 0), 0); S._pwSeen = t; try { localStorage.setItem(PW_SEEN, String(t)); } catch (e) {} }
function pwGroups(field, min) { // nhóm theo mã thiết bị / IP, chỉ lấy nhóm có >= min tài khoản khác nhau
  const m = new Map();
  pwActive().forEach(x => { const k = x[field]; if (!k) return; if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return [...m].map(([k, ev]) => { const accs = new Map(); ev.forEach(e => { if (!accs.has(e.key) || accs.get(e.key).t < e.t) accs.set(e.key, e); }); return { k, ev, accs: [...accs.values()].sort((a, b) => b.t - a.t) }; }).filter(g => g.accs.length >= min);
}
const pwFlagged = () => pwGroups("dev", 2);
const devCount = x => { const g = pwFlagged().find(g => g.k === x.dev); return g ? g.accs.length : 1; };

const f1s = n => String(Math.round(n * 10) / 10).replace(".", ",");
function stuStats() {
  const best = bestScores(), vis = visQuizzes(), me = norm(S.user || "");
  const done = vis.filter(q => best[q.id] != null), good = vis.filter(q => best[q.id] >= 8);
  const avg = done.length ? done.reduce((s, q) => s + best[q.id], 0) / done.length : null;
  return { best, vis, done, good, avg, tries: S.results.filter(r => norm(r.name || "") === me).length };
}
function renderStudentHome() {
  const st = stuStats(), subjN = id => (S.subjects.find(s => s.id === id) || {}).name || "";
  const tile = (n, lab) => `<div class="tile"><b>${n}</b><span>${lab}</span></div>`;
  const drafts = st.vis.filter(q => loadDraft(q)), fresh = st.vis.filter(q => qStatus(q) === "new" && st.best[q.id] == null).slice(0, 5);
  const rowQ = (q, btn) => `<div class="row sp lrow"><div><b>${esc(q.title)}</b><div class="mu">${esc(subjN(q.subject))} · ${nQ(q)} câu</div></div>${btn}</div>`;
  const subs = S.subjects.map(s => {
    const qs = st.vis.filter(q => q.subject === s.id), g = qs.filter(q => st.best[q.id] >= 8).length, d = qs.filter(q => st.best[q.id] != null).length;
    return `<button class="scard" onclick="openSub('${s.id}')"><b>${esc(s.name)}</b><span>${qs.length} bài${qs.length ? " · đã làm " + d : ""}</span><div class="pb"><i style="width:${qs.length ? Math.round(g / qs.length * 100) : 0}%"></i></div><small>${g}/${qs.length} bài đạt từ 8 điểm</small></button>`;
  }).join("");
  return `<div class="card"><h2>Chào ${esc(S.user)}</h2><p class="mu" style="margin:0">Lớp 11B02. Chọn một môn bên dưới hoặc ở thanh bên trái để bắt đầu làm bài.</p>
    <div class="tiles t4">${tile(st.done.length + "/" + st.vis.length, "bài đã làm")}${tile(st.good.length, "bài đạt từ 8 điểm")}${tile(st.avg == null ? "–" : f1s(st.avg), "điểm trung bình")}${tile(st.tries, "lượt làm bài")}</div></div>` +
    (drafts.length ? `<div class="card"><b>Đang làm dở</b>${drafts.map(q => rowQ(q, `<div class="row"><button onclick="S.sub='${q.subject}';take('${q.id}','resume')">Tiếp tục</button></div>`)).join("")}</div>` : "") +
    (fresh.length ? `<div class="card"><b>Bài mới chưa làm</b>${fresh.map(q => rowQ(q, `<div class="row"><button onclick="S.sub='${q.subject}';pick('${q.id}')">Làm bài</button></div>`)).join("")}</div>` : "") +
    `<div class="card"><b>Môn học</b><div class="scards">${subs || `<p class="mu">Chưa có môn học.</p>`}</div></div>` +
    `<p class="mu" style="margin:0 4px 14px">Trang web thuộc quyền sở hữu của lớp 11B02 do Lunar quản lý. Quyền sử dụng chỉ thuộc về lớp 11B02 và các lớp được cho phép. Hãy liên hệ lớp 11B02 nếu muốn được sử dụng.</p>`;
}

}

  $("eimgs").innerHTML = toks.length ? `<div class="card"><b>Ảnh trong đề</b>` + toks.map(id => {
    const src = S.quiz.imgs[ikey(id)];
    return `<div class="thumb">${src ? `<img src="${src}" alt="">` : ""}<div style="flex:1"><code>[ảnh:${esc(id)}]</code><div class="${src ? "mu" : "tag-no"}">${src ? Math.round(src.length / 1024) + " KB" : "Chưa có ảnh"}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap">${FIGSRC[fk(id)] ? `<button class="g" data-k="${esc(id)}" onclick="recrop(this.dataset.k)">Cắt lại</button>` : ""}<button class="g" data-k="${esc(id)}" onclick="pickImg(this.dataset.k)">${src ? "Đổi ảnh" : "Chọn ảnh"}</button></div></div>`;
  }).join("") + `<div class="mu">Tổng dung lượng ảnh: ${Math.round(imgBytes($("ex").value) / 1024)} KB / ${Math.round(imgBudget($("ex").value) / 1024)} KB${imgBytes($("ex").value) > imgBudget($("ex").value) ? ` <span class="tag-no">· vượt mức, khi lưu app sẽ tự nén ảnh</span>` : ""}</div></div>` : "";
  $("ep").innerHTML = `Đọc được <b>${r.qs.length}</b> câu hợp lệ.` + (r.errors.length ? ` <span class="tag-no">${esc(r.errors.join("; "))}</span>` : "");
  prevPreview(r.qs);
}
function prevPreview(qs) {
  const d = $("epvd"); if (!d || !d.open) return;
  $("epv").innerHTML = qs.slice(0, 3).map((q, i) => `<div style="margin:8px 0"><b>Câu ${i + 1}.</b> ${R(q.q)}` +
    (q.sts.length ? q.sts.map(x => `<div>${x.k}) ${R(x.t)} <small class="mu">= ${x.v ? "Đ" : "S"}</small></div>`).join("") : q.sa !== undefined ? `<div>Đáp án: <b>${esc(q.sa)}</b> <small class="mu">(câu trả lời ngắn)</small></div>` : q.opts.map(o => `<div>${o.k}. ${R(o.t)}${o.k === q.ans ? ` <span class="tag-ok">✓</span>` : ""}</div>`).join("")) + `</div>`).join("") || `<span class="mu">Chưa có câu nào.</span>`;
}
async function saveQuiz() {
  const title = $("et").value.trim(), text = $("ex").value, r = parse(text);
  if (!title) return alert("Hãy nhập tên bài.");
  if (!r.qs.length) return alert("Chưa có câu hỏi hợp lệ nào. Xem “Cách viết đề” bên dưới.");
  if (r.errors.length && !confirm("Có câu bị lỗi và sẽ bị bỏ qua:\n" + r.errors.join("\n") + "\nVẫn lưu?")) return;
  const miss = tokensOf(text).filter(id => !S.quiz.imgs[ikey(id)]);
  if (miss.length && !confirm("Còn ảnh chưa chọn: " + miss.join(", ") + "\nVẫn lưu?")) return;
  let imgs = {}; tokensOf(text).forEach(id => { const k = ikey(id); if (S.quiz.imgs[k]) imgs[k] = S.quiz.imgs[k]; });
  const budget = imgBudget(text), used = Object.values(imgs).reduce((n, x) => n + x.length, 0);
  if (used > budget) {
    let sh = null; try { sh = await shrinkImgs(imgs, budget); } catch (e) { return alert(e.message); }
    if (!sh) return alert("Ảnh quá nhiều: dù đã nén tối đa vẫn vượt " + Math.round(budget / 1024) + " KB. Hãy bớt ảnh hoặc dùng link ảnh [ảnh:https://...].");
    imgs = sh.imgs; alert("Ảnh vượt dung lượng nên app đã tự nén: " + Math.round(sh.before / 1024) + " KB → " + Math.round(sh.after / 1024) + " KB.");
  }
  const gEls = document.querySelectorAll(".egrp");
  const groups = gEls.length ? [...gEls].filter(x => x.checked).map(x => x.value) : grpOf(S.quiz); // chưa tải nhóm → giữ nguyên, không vô tình mở cho cả lớp
  const newSub = $("es").value; let order = null;
  if (S.quiz.id && S.quiz.subject === newSub) order = S.quiz.order != null ? S.quiz.order : null;
  else { const os = S.quizzes.filter(q => q.subject === newSub && q.order != null).map(q => q.order); if (os.length) order = Math.max(...os) + 10; }
  S.sub = newSub;
  store.put("quizzes", { id: S.quiz.id || uid(), subject: S.sub, title, text, imgs, tags: parseTags($("etg").value), st: $("est").value, groups, order, time: S.quiz.time || Date.now() })
    .then(() => go("list")).catch(e => alert("Lưu thất bại: " + e.message));
}
function delQuiz(id) { if (confirm("Xóa bài này?")) store.del("quizzes", id); }
function delRes(id) { if (confirm("Xóa dòng kết quả này?")) store.del("results", id); }

/* ===================== NHÓM: AI ĐƯỢC THẤY & LÀM BÀI ===================== */
// Bài có groups = [] (hoặc không có) → cả lớp thấy. Bài gắn nhóm → chỉ thành viên các nhóm đó (và quản trị) thấy, làm được.
const grpOf = q => (q && Array.isArray(q.groups)) ? q.groups : [];
const inGroup = (g, name) => { const k = norm(name || ""); return (g.members || []).some(m => norm(m) === k); };
function canSee(q) {
  if (S.admin) return true;
  const gs = grpOf(q); if (!gs.length) return true;
  if (!S.groupsReady) return false; // chưa đọc được danh sách nhóm → ẩn bài hạn chế cho an toàn
  return gs.some(id => { const g = S.groups.find(x => x.id === id); return !!g && inGroup(g, S.user); });
}
const visQuizzes = () => S.quizzes.filter(canSee);
function grpBadge(q) {
  const gs = grpOf(q); if (!S.admin || !gs.length) return "";
  const names = gs.map(id => { const g = S.groups.find(x => x.id === id); return g ? g.name : "(nhóm đã xóa)"; }).join(", ");
  return `<span class="bdg grp" title="Chỉ các nhóm này thấy và làm được bài">Nhóm: ${esc(names)}</span>`;
}
function groupPicker(q) {
  if (!S.groups.length) return `<span class="mu">Chưa có nhóm nào nên bài này cả lớp đều thấy. Tạo nhóm ở mục “Nhóm học sinh” bên trái.</span>`;
  const cur = grpOf(q);
  return `<div class="gchk">${S.groups.map(g => `<label><input type="checkbox" class="egrp" value="${g.id}" ${cur.includes(g.id) ? "checked" : ""}>${esc(g.name)} <small class="mu">${(g.members || []).length}</small></label>`).join("")}</div><div class="mu" style="margin-top:6px">Không chọn nhóm nào = cả lớp đều thấy. Chọn nhóm = chỉ thành viên các nhóm đó thấy và làm được bài.</div>`;
}
function renderGroups() {
  return `<div class="card"><h2>Nhóm học sinh</h2>
    <p class="mu">Tạo nhóm, tick học sinh vào nhóm, rồi gắn nhóm cho từng bài (nút “Sửa” bài → “Ai được thấy và làm bài này”). Bài không gắn nhóm thì cả lớp đều thấy.</p>
    ${S.groupsErr ? `<p class="tag-no">Không đọc được nhóm: ${esc(S.groupsErr)}. Hãy thêm <code>groups</code> vào Firestore Rules rồi Publish.</p>` : ""}
    <div class="row"><input type="text" id="gnew" placeholder="Tên nhóm mới, vd: Nhóm 1, Đội tuyển Toán" maxlength="60" autocomplete="off" style="max-width:360px" onkeydown="if(event.key==='Enter')addGroup()"><button onclick="addGroup()">+ Tạo nhóm</button></div></div>` +
  (S.groups.length ? S.groups.map(g => `<div class="card"><div class="row sp"><h3 style="margin:0">${esc(g.name)} <small class="mu">· ${(g.members || []).length}/${STUDENTS.length} học sinh · ${S.quizzes.filter(q => grpOf(q).includes(g.id)).length} bài</small></h3><div class="row"><button class="g" onclick="renameGroup('${g.id}')">Đổi tên</button><button class="d" onclick="delGroup('${g.id}')">Xóa nhóm</button></div></div>
    <div class="row" style="margin:10px 0"><button class="g" onclick="grpAll('${g.id}',true)">Chọn cả lớp</button><button class="g" onclick="grpAll('${g.id}',false)">Bỏ chọn hết</button></div>
    <div class="gchk">${STUDENTS.map(n => `<label><input type="checkbox" ${inGroup(g, n) ? "checked" : ""} data-g="${g.id}" data-n="${esc(n)}" onchange="grpToggle(this)">${esc(n)}</label>`).join("")}</div></div>`).join("") : `<div class="card mu">Chưa có nhóm nào.</div>`);
}
function addGroup() {
  const el = $("gnew"), n = el.value.trim(); if (!n) return el.focus();
  if (S.groups.some(g => norm(g.name) === norm(n))) return alert("Đã có nhóm tên này.");
  store.put("groups", { id: uid(), name: n, members: [], o: Date.now() }).catch(e => alert("Không lưu được: " + (e.message || e) + "\nKiểm tra Firestore Rules cho “groups”."));
}
function renameGroup(id) {
  const g = S.groups.find(x => x.id === id); if (!g) return;
  const n = prompt("Tên nhóm:", g.name); if (n && n.trim()) store.patch("groups", id, { name: n.trim() }).catch(e => alert("Không lưu được: " + (e.message || e)));
}
function delGroup(id) {
  const g = S.groups.find(x => x.id === id); if (!g) return;
  const qs = S.quizzes.filter(q => grpOf(q).includes(id)), only = qs.filter(q => grpOf(q).length === 1);
  if (!confirm(`Xóa nhóm “${g.name}”?` + (only.length ? `\n\n${only.length} bài chỉ thuộc nhóm này sẽ trở thành bài CẢ LỚP đều thấy.` : ""))) return;
  qs.forEach(q => store.patch("quizzes", q.id, { groups: grpOf(q).filter(x => x !== id) }));
  store.del("groups", id);
}
function grpToggle(el) {
  const g = S.groups.find(x => x.id === el.dataset.g); if (!g) return;
  const set = new Set(g.members || []); if (el.checked) set.add(el.dataset.n); else set.delete(el.dataset.n);
  store.patch("groups", g.id, { members: STUDENTS.filter(n => set.has(n)) }).catch(e => { alert("Không lưu được: " + (e.message || e)); renderMain(); });
}
function grpAll(id, on) { store.patch("groups", id, { members: on ? STUDENTS.slice() : [] }).catch(e => alert("Không lưu được: " + (e.message || e))); }

/* ===================== CHAT RIÊNG GIỮA CÁC BẠN ===================== */
// Collection "presence": mỗi người 1 doc báo "còn online". Collection "dm": tin nhắn, members = [khóa 2 người].
const PRES_TTL = 150000, PRES_BEAT = 60000;
const CH = { on: false, open: false, peer: null, pres: [], dm: [], me: null };
const chName = k => { const n = [CONFIG.ADMIN].concat(STUDENTS).find(x => pkey(x) === k); return n || k; };
const chLabel = k => chName(k) + (k === pkey(CONFIG.ADMIN) ? " (quản trị)" : "");
const chAv = k => (chName(k).trim().split(" ").pop() || "?").charAt(0).toUpperCase();
const chIsOn = k => { const p = CH.pres.find(x => x.id === "p_" + k); return !!p && Date.now() - (p.last || 0) < PRES_TTL; };
const chReadKey = k => "lh_cr_" + CH.me + "_" + k;
const chRead = k => { try { return +localStorage.getItem(chReadKey(k)) || 0; } catch (e) { return 0; } };
const chMark = k => { const t = CH.dm.reduce((m, x) => x.from === k ? Math.max(m, x.t || 0) : m, 0); try { if (t) localStorage.setItem(chReadKey(k), String(t)); } catch (e) {} };
const chMsgs = k => CH.dm.filter(m => (m.members || []).includes(k)).sort((a, b) => (a.t || 0) - (b.t || 0));
const chUnread = k => k === CH.me ? 0 : CH.dm.filter(m => m.from === k && (m.t || 0) > chRead(k)).length;
function chBeat(off) {
  try { Promise.resolve(store.put("presence", { id: "p_" + CH.me, name: S.user, last: off ? 0 : Date.now() })).catch(() => {}); } catch (e) {}
}
function chatInit() {
  if (CH.on) return; CH.on = true;
  CH.me = pkey(S.user);
  $("cbtn").hidden = false;
  store.sub("presence", a => { CH.pres = a; if (CH.open && !CH.peer) chList(); else if (CH.open) chHead(); }, e => console.warn("presence", e));
  store.subq("dm", "members", CH.me, a => {
    CH.dm = a;
    if (CH.open && CH.peer) { chMark(CH.peer); chThread(); }
    chBadge(); if (CH.open && !CH.peer) chList();
  }, e => console.warn("dm", e));
  chBeat();
  setInterval(() => { if (!document.hidden) chBeat(); if (CH.open && !CH.peer) chList(); }, PRES_BEAT / 2);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) chBeat(); });
  addEventListener("pagehide", () => chBeat(true));
  $("cin").addEventListener("keydown", e => { if (e.key === "Enter") chatSend(); });
}
function chBadge() {
  const n = [CONFIG.ADMIN].concat(STUDENTS).map(pkey).filter(k => k !== CH.me).reduce((c, k) => c + chUnread(k), 0), b = $("cbg");
  b.hidden = !n; b.textContent = n > 99 ? "99+" : n;
}
function chatToggle(v) {
  CH.open = v === undefined ? !CH.open : v;
  $("cpanel").classList.toggle("on", CH.open);
  if (CH.open) { chBeat(); chatOpen(CH.peer); }
}
function chHead() {
  const k = CH.peer;
  $("cback").hidden = !k;
  $("ctitle").innerHTML = k ? `${esc(chLabel(k))} <small style="font-weight:400;opacity:.8">· ${chIsOn(k) ? "đang online" : "offline"}</small>` : "Tin nhắn";
}
function chatOpen(k) {
  CH.peer = k;
  $("clist").hidden = !!k; $("cmsgs").hidden = !k; $("cform").hidden = !k;
  chHead();
  if (k) { chMark(k); chBadge(); chThread(true); $("cin").focus(); } else chList();
}
function chList() {
  const list = [CONFIG.ADMIN].concat(STUDENTS).map(pkey).filter(k => k !== CH.me);
  const last = k => { const m = chMsgs(k); return m.length ? m[m.length - 1] : null; };
  const rows = list.map(k => ({ k, on: chIsOn(k), l: last(k), u: chUnread(k) }))
    .sort((a, b) => (b.on - a.on) || ((b.l ? b.l.t : 0) - (a.l ? a.l.t : 0)) || chName(a.k).localeCompare(chName(b.k), "vi"));
  const item = r => `<button type="button" class="cl" onclick="chatOpen('${r.k}')"><span class="cav">${esc(chAv(r.k))}<i class="${r.on ? "on" : ""}"></i></span>
    <span class="nm"><b>${esc(chLabel(r.k))}</b><small>${r.l ? (r.l.from === CH.me ? "Bạn: " : "") + esc(r.l.text) : (r.on ? "Đang online" : "Offline")}</small></span>${r.u ? `<span class="bg">${r.u}</span>` : ""}</button>`;
  const on = rows.filter(r => r.on), off = rows.filter(r => !r.on);
  $("clist").innerHTML = (on.length ? `<div class="csep">Đang online · ${on.length}</div>` + on.map(item).join("") : "") +
    (off.length ? `<div class="csep">Offline</div>` + off.map(item).join("") : "");
}
function chThread(force) {
  const b = $("cmsgs"), near = force || b.scrollHeight - b.scrollTop - b.clientHeight < 80;
  const ms = chMsgs(CH.peer), today = new Date().toDateString();
  b.innerHTML = ms.length ? ms.map(m => {
    const d = new Date(m.t || 0), tm = d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + (d.toDateString() === today ? "" : " " + d.toLocaleDateString("vi-VN"));
    return `<div class="mb ${m.from === CH.me ? "me" : "th"}">${esc(m.text)}<small>${tm}</small></div>`;
  }).join("") : `<p class="mu" style="text-align:center;margin-top:30px">Chưa có tin nhắn nào. Hãy nói xin chào nhé!</p>`;
  if (near) b.scrollTop = b.scrollHeight;
}
function chatSend() {
  const i = $("cin"), t = i.value.trim().slice(0, 500);
  if (!t || !CH.peer) return;
  i.value = "";
  store.put("dm", { id: uid(), members: [CH.me, CH.peer].sort(), from: CH.me, text: t, t: Date.now() }).catch(e => alert("Không gửi được: " + (e.message || e)));
}
</script>
</body>
</html>
